      - The relationship direction is Starting Occurrent → Longer Occurrent.

  - label: Has Post-Condition
    iri: "https://spec.industrialontologies.org/ontology/core/Core/hasPostCondition"
    definition: >
      relation between an action specification or plan specification and a material state specification such that every material state prescribed by the material state specification holds in a post-state of every process or event prescribed by the action specification or plan specification
    domain: [Action Specification, Plan Specification]
    range: [Material State Specification]
    extraction_constraints:
      - Subject must be an Action Specification or Plan Specification.
      - Object must be a Material State Specification.
      - The relationship direction is Specification → Material State Specification.

  - label: Has Pre-Condition
    iri: "https://spec.industrialontologies.org/ontology/core/Core/hasPreCondition"
    definition: >
      relation between an Action Specification or Plan Specification and a Material State Specification such that every material state prescribed by the Material State Specification holds in a pre-state of every process or event prescribed by the Action Specification or Plan Specification
    domain: [Action Specification, Plan Specification]
    range: [Material State Specification]
    extraction_constraints:
      - Subject must be an Action Specification or Plan Specification.
      - Object must be a Material State Specification.
      - The relationship direction is Specification → Material State Specification.