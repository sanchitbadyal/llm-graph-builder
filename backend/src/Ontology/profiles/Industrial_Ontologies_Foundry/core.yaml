profile:
  id: core-selected
  ontology_artifact: core
  description: >-
    Shared IOF Core context for agents, organizations, material entities, information content, processes, roles, capabilities and measurement. Only the explicitly selected classes are sent to the LLM; ancestors appear as context only.
  include_ancestors: true
  include_compatible_properties: true

groups:
  agents_and_organizations:
    - label: "Agent"
      iri: https://spec.industrialontologies.org/ontology/construct/Agent
      parent: "Material Entity"
      definition: "A person, group of persons, or engineered system with an agent role."
    - label: "Person"
      iri: https://spec.industrialontologies.org/ontology/construct/Person
      parent: "Material Entity"
      definition: "An organism that is a member of the species Homo sapiens."
    - label: "Organized Group Of Agents"
      iri: https://spec.industrialontologies.org/ontology/construct/OrganizedGroupOfAgents
      parent: "Group Of Agents"
      definition: "A group of agents pursuing a common set of plans and objectives."
    - label: "Group Of Agents"
      iri: https://spec.industrialontologies.org/ontology/construct/GroupOfAgents
      parent: "Object Aggregate"
      definition: "A group that has one or more agents as members."
    - label: "Agent Role"
      iri: https://spec.industrialontologies.org/ontology/construct/AgentRole
      parent: "Role"
      definition: "A role held when acting on behalf of a person, engineered system, or group of agents."
  material_and_systems:
    - label: "Material Artifact"
      iri: https://spec.industrialontologies.org/ontology/construct/MaterialArtifact
      parent: "Object"
      definition: "An object deliberately created to have a certain function."
    - label: "Material Product"
      iri: https://spec.industrialontologies.org/ontology/construct/MaterialProduct
      parent: "Material Entity"
      definition: "A material entity that has the material product role."
    - label: "Raw Material"
      iri: https://spec.industrialontologies.org/ontology/construct/RawMaterial
      parent: "Material Entity"
      definition: "A material entity acquired with a plan to transform or modify it into components, substances, or a product."
    - label: "Material Component"
      iri: https://spec.industrialontologies.org/ontology/construct/MaterialComponent
      parent: "Material Entity"
      definition: "A material entity that has the material component role."
    - label: "Container"
      iri: https://spec.industrialontologies.org/ontology/construct/Container
      parent: "Material Artifact"
      definition: "A material artifact designed to hold one or more material entities."
    - label: "System"
      iri: https://spec.industrialontologies.org/ontology/construct/System
      parent: "Object Aggregate"
      definition: "A collection of elements that forms a unified whole and interacts."
    - label: "Engineered System"
      iri: https://spec.industrialontologies.org/ontology/construct/EngineeredSystem
      parent: "System"
      definition: "A system deliberately created to have a certain function."
    - label: "Piece Of Equipment"
      iri: https://spec.industrialontologies.org/ontology/construct/PieceOfEquipment
      parent: "Material Entity"
      definition: "A material artifact or engineered system with an equipment role."
  processes_and_roles:
    - label: "Planned Process"
      iri: https://spec.industrialontologies.org/ontology/construct/PlannedProcess
      parent: "Process"
      definition: "A process prescribed by a plan specification."
    - label: "Manufacturing Process"
      iri: https://spec.industrialontologies.org/ontology/construct/ManufacturingProcess
      parent: "Planned Process"
      definition: "A planned process in which input material is transformed or modified through structured operations."
    - label: "Business Process"
      iri: https://spec.industrialontologies.org/ontology/construct/BusinessProcess
      parent: "Planned Process"
      definition: "A planned process prescribed by a plan specification with objectives specified by a business organization."
    - label: "Role"
      iri: http://purl.obolibrary.org/obo/BFO_0000023
      parent: "Specifically Dependent Continuant"
      definition: "A realizable entity that exists because something bears it in a particular context."
    - label: "Capability"
      iri: https://spec.industrialontologies.org/ontology/construct/Capability
      parent: "Disposition"
      definition: "A disposition in whose realization some agent has an interest."
    - label: "Process Characteristic"
      iri: https://spec.industrialontologies.org/ontology/construct/ProcessCharacteristic
      parent: "Continuant"
      definition: "A continuant that summarizes an attribute of a process over its entire duration."
  information_and_measurement:
    - label: "Information Content Entity"
      iri: https://spec.industrialontologies.org/ontology/construct/InformationContentEntity
      parent: "Generically Dependent Continuant"
      definition: "Content or a pattern that is about some entity."
    - label: "Plan Specification"
      iri: https://spec.industrialontologies.org/ontology/construct/PlanSpecification
      parent: "Information Content Entity"
      definition: "An information content entity that has action specifications and objective specifications as parts."
    - label: "Requirement Specification"
      iri: https://spec.industrialontologies.org/ontology/construct/RequirementSpecification
      parent: "Information Content Entity"
      definition: "An information content entity that prescribes a set of requirements."
    - label: "Value Expression"
      iri: https://spec.industrialontologies.org/ontology/construct/ValueExpression
      parent: "Information Content Entity"
      definition: "An information content entity containing a value within a classification scheme or quantitative scale."
    - label: "Measured Value Expression"
      iri: https://spec.industrialontologies.org/ontology/construct/MeasuredValueExpression
      parent: "Value Expression"
      definition: "A value expression containing the measured value of an attribute or temporal region."
    - label: "Measurement Process"
      iri: https://spec.industrialontologies.org/ontology/construct/MeasurementProcess
      parent: "Planned Process"
      definition: "A planned process to determine the value of an attribute of an entity of interest."

  rdf_core_additional_classes:
    # Additional named classes declared in Core.rdf. Existing curated classes
    # above are intentionally preserved with their prompt-facing metadata.
    - label: "Process Profile"
      iri: http://purl.obolibrary.org/obo/BFO_0000144
      parent: "Process"
      definition: "A process that is a proper part of another process and that captures the time-dependent behavior of some attribute of that process."
    - label: "Action Specification"
      iri: https://spec.industrialontologies.org/ontology/construct/ActionSpecification
      parent: "Information Content Entity"
      definition: "An information content entity that prescribes what participants shall do in a process."
    - label: "Agreement"
      iri: https://spec.industrialontologies.org/ontology/construct/Agreement
      parent: "Information Content Entity"
      definition: "An understanding between two or more parties that contains a set of commitments on the part of the parties."
    - label: "Algorithm"
      iri: https://spec.industrialontologies.org/ontology/construct/Algorithm
      parent: "Information Content Entity"
      definition: "An information content entity that prescribes procedural or declarative steps which can be translated to computer interpretable instructions."
    - label: "Assembly"
      iri: https://spec.industrialontologies.org/ontology/construct/Assembly
      parent: "Material Artifact"
      definition: "A material artifact that is composed of material components that are physically connected and that is capable of disassembly."
    - label: "Assembly Process"
      iri: https://spec.industrialontologies.org/ontology/construct/AssemblyProcess
      parent: "Manufacturing Process"
      definition: "A manufacturing process in which a number of material components are physically connected to each other to form an assembly."
    - label: "Business Function"
      iri: https://spec.industrialontologies.org/ontology/construct/BusinessFunction
      parent: "Function"
      definition: "A function of an organization to partake in for profit activities as prescribed by the objectives specified by that organization."
    - label: "Business Organization"
      iri: https://spec.industrialontologies.org/ontology/construct/BusinessOrganization
      parent: "Organization"
      definition: "An organization engaging in or planning to engage in any activity of buying and selling goods or services for a profit."
    - label: "Buyer"
      iri: https://spec.industrialontologies.org/ontology/construct/Buyer
      parent: "Agent"
      definition: "A person or organization which has a buyer role."
    - label: "Buyer Role"
      iri: https://spec.industrialontologies.org/ontology/construct/BuyerRole
      parent: "Agent Role"
      definition: "An agent role held by a person or organization when it buys a product or a service."
    - label: "Buying Business Process"
      iri: https://spec.industrialontologies.org/ontology/construct/BuyingBusinessProcess
      parent: "Business Process"
      definition: "A business process wherein a financial instrument is used by an agent (buyer) to acquire ownership of a product or commercial service from another agent (seller) for the buyer itself or for another agent (customer)."
    - label: "Classifier"
      iri: https://spec.industrialontologies.org/ontology/construct/Classifier
      parent: "Denoter"
      definition: "A denoter that classifies some entity."
    - label: "Commercial Service"
      iri: https://spec.industrialontologies.org/ontology/construct/CommercialService
      parent: "Business Process"
      definition: "A business process that consists of a service provisioning process and a consumption process."
    - label: "Commercial Service Agreement"
      iri: https://spec.industrialontologies.org/ontology/construct/CommercialServiceAgreement
      parent: "Agreement"
      definition: "An agreement between a customer and service provider that is about some commercial service to be provided by the service provider in exchange for compensation from the customer."
    - label: "Commercial Service Specification"
      iri: https://spec.industrialontologies.org/ontology/construct/CommercialServiceSpecification
      parent: "Plan Specification"
      definition: "A plan specification that prescribes a commercial service."
    - label: "Complex Material State"
      iri: https://spec.industrialontologies.org/ontology/construct/ComplexMaterialState
      parent: "Material State"
      definition: "A material state whose condition is an aggregated condition composed from the conditions of two or more material states that hold in it."
    - label: "Computing Process"
      iri: https://spec.industrialontologies.org/ontology/construct/ComputingProcess
      parent: "Planned Process"
      definition: "A planned process in which an algorithm or an encoded algorithm is realized by an agent."
    - label: "Consumable"
      iri: https://spec.industrialontologies.org/ontology/construct/Consumable
      parent: "Material Entity"
      definition: "A material entity which has the consumable role."
    - label: "Consumable Role"
      iri: https://spec.industrialontologies.org/ontology/construct/ConsumableRole
      parent: "Role"
      definition: "A role held by a material entity when it is planned to be, or is partially or fully used up in a planned process."
    - label: "Customer"
      iri: https://spec.industrialontologies.org/ontology/construct/Customer
      parent: "Agent"
      definition: "A person or organization which has a customer role."
    - label: "Customer Role"
      iri: https://spec.industrialontologies.org/ontology/construct/CustomerRole
      parent: "Agent Role"
      definition: "An agent role held by a person or organization when it utilizes the product or receives the service or subscribes to the commercial service agreement."
    - label: "Denoter"
      iri: https://spec.industrialontologies.org/ontology/construct/Denoter
      parent: "Information Content Entity"
      definition: "An information content entity that denotes some entity."
    - label: "Descriptive Information Content Entity"
      iri: https://spec.industrialontologies.org/ontology/construct/DescriptiveInformationContentEntity
      parent: "Information Content Entity"
      definition: "An information content entity that characterizes (gives a description of) an entity."
    - label: "Design Specification"
      iri: https://spec.industrialontologies.org/ontology/construct/DesignSpecification
      parent: "Information Content Entity"
      definition: "An information content entity that prescribes something man-made."
    - label: "Designative Information Content Entity"
      iri: https://spec.industrialontologies.org/ontology/construct/DesignativeInformationContentEntity
      parent: "Information Content Entity"
      definition: "An information content entity that uniquely identifies an entity."
    - label: "Designed Function"
      iri: https://spec.industrialontologies.org/ontology/construct/DesignedFunction
      parent: "Function"
      definition: "A function that is intentionally designed."
    - label: "Directive Information Content Entity"
      iri: https://spec.industrialontologies.org/ontology/construct/DirectiveInformationContentEntity
      parent: "Information Content Entity"
      definition: "An information content entity that prescribes a set of rules or guidelines for a process or a model of something man-made."
    - label: "Encoded Algorithm"
      iri: https://spec.industrialontologies.org/ontology/construct/EncodedAlgorithm
      parent: "Plan Specification"
      definition: "A plan specification that is the implementation of an algorithm encoded in a specific programming language or framework and that is readily executable."
    - label: "Equipment Role"
      iri: https://spec.industrialontologies.org/ontology/construct/EquipmentRole
      parent: "Role"
      definition: "A role held by a material artifact or an engineered system when it is planned to be involved in or is involved in carrying out some part of a planned process and that is not consumed in that planned process."
    - label: "Event"
      iri: https://spec.industrialontologies.org/ontology/construct/Event
      parent: "Occurrent"
      definition: "A phenomenon (process or process boundary) that is recognized by an agent and typically recorded."
    - label: "Gain Of Role"
      iri: https://spec.industrialontologies.org/ontology/construct/GainOfRole
      parent: "Process"
      definition: "A process in which someone or something (independent continuant that is not a spatial region) becomes the bearer of a role."
    - label: "Group Of Persons"
      iri: https://spec.industrialontologies.org/ontology/construct/GroupOfPersons
      parent: "Object Aggregate"
      definition: "A group (object aggregate) that has one or more persons as members."
    - label: "Identifier"
      iri: https://spec.industrialontologies.org/ontology/construct/Identifier
      parent: "Denoter"
      definition: "A denoter that is used to uniquely identify an entity within a particular context."
    - label: "Input Specification"
      iri: https://spec.industrialontologies.org/ontology/construct/InputSpecification
      parent: "Information Content Entity"
      definition: "An information content entity that prescribes the entities to be used as inputs to a planned process or the attributes they must possess to serve as valid inputs."
    - label: "Loss Of Role"
      iri: https://spec.industrialontologies.org/ontology/construct/LossOfRole
      parent: "Process"
      definition: "A process in which someone or something (independent continuant that is not a spatial region) ceases to be the bearer of a role."
    - label: "Maintainable Material Item"
      iri: https://spec.industrialontologies.org/ontology/construct/MaintainableMaterialItem
      parent: "Material Entity"
      definition: "A material artifact or engineered system which has the maintainable material item role."
    - label: "Maintainable Material Item Role"
      iri: https://spec.industrialontologies.org/ontology/construct/MaintainableMaterialItemRole
      parent: "Role"
      definition: "A role played by an asset (engineered system or material artifact) when there is a maintenance strategy prescribing its maintenance process."
    - label: "Manufacturer"
      iri: https://spec.industrialontologies.org/ontology/construct/Manufacturer
      parent: "Agent"
      definition: "An organization which has a manufacturer role."
    - label: "Manufacturer Role"
      iri: https://spec.industrialontologies.org/ontology/construct/ManufacturerRole
      parent: "Agent Role"
      definition: "An agent role held by an organization when it produces material products."
    - label: "Material Component Role"
      iri: https://spec.industrialontologies.org/ontology/construct/MaterialComponentRole
      parent: "Role"
      definition: "A role held by a material entity when it is a proper part of another material entity or is planned to be a proper part of another material entity."
    - label: "Material Containment Capability"
      iri: https://spec.industrialontologies.org/ontology/construct/MaterialContainmentCapability
      parent: "Capability"
      definition: "A capability of a material entity that is grounded in the entity's physical structure and that can be realized in a process in which the entity holds one or more material entities within a bounded interior, cavity, surface-delimited area, or contained site."
    - label: "Material Containment Function"
      iri: https://spec.industrialontologies.org/ontology/construct/MaterialContainmentFunction
      parent: "Material Containment Capability"
      definition: "A material containment capability that is a function of a material entity."
    - label: "Material Location Change Process"
      iri: https://spec.industrialontologies.org/ontology/construct/MaterialLocationChangeProcess
      parent: "Planned Process"
      definition: "A planned process that results in a material entity moving from one physical location to another."
    - label: "Material Product Role"
      iri: https://spec.industrialontologies.org/ontology/construct/MaterialProductRole
      parent: "Role"
      definition: "A role held by a material entity that is intended to be sold, or has been bought, or has been supplied."
    - label: "Material Resource"
      iri: https://spec.industrialontologies.org/ontology/construct/MaterialResource
      parent: "Material Entity"
      definition: "A material entity which has the material resource role."
    - label: "Material Resource Role"
      iri: https://spec.industrialontologies.org/ontology/construct/MaterialResourceRole
      parent: "Role"
      definition: "A role played by a material entity that consists in it being available to a person or group of agents or engineered system."
    - label: "Material State"
      iri: https://spec.industrialontologies.org/ontology/construct/MaterialState
      parent: "Process"
      definition: "A process in which a material entity that participates in the process has a condition that remains unchanged."
    - label: "Material State Condition Expression"
      iri: https://spec.industrialontologies.org/ontology/construct/MaterialStateConditionExpression
      parent: "Value Expression"
      definition: "A value expression that, as part of a material state specification, expresses a condition on a characteristic, profile, quality, location, or other relevant feature, to which the material state prescribed by that specification continuously conforms throughout its occurrence."
    - label: "Material State Specification"
      iri: https://spec.industrialontologies.org/ontology/construct/MaterialStateSpecification
      parent: "Information Content Entity"
      definition: "An information content entity that prescribes a material state."
    - label: "Measurement Capability"
      iri: https://spec.industrialontologies.org/ontology/construct/MeasurementCapability
      parent: "Capability"
      definition: "A capability of a material entity to measure the value of some entity."
    - label: "Measurement Information Content Entity"
      iri: https://spec.industrialontologies.org/ontology/construct/MeasurementInformationContentEntity
      parent: "Information Content Entity"
      definition: "Informational content that is the result of measuring a set of attributes belonging to the entity the informational content is about."
    - label: "Objective Specification"
      iri: https://spec.industrialontologies.org/ontology/construct/ObjectiveSpecification
      parent: "Information Content Entity"
      definition: "An information content entity that prescribes what the outcome of some process should be."
    - label: "Organization"
      iri: https://spec.industrialontologies.org/ontology/construct/Organization
      parent: "Organized Group Of Agents"
      definition: "A group of persons that identifies itself by some name and pursues a common set of plans and objectives."
    - label: "Organization Identifier"
      iri: https://spec.industrialontologies.org/ontology/construct/OrganizationIdentifier
      parent: "Identifier"
      definition: "An identifier that identifies an organization."
    - label: "Output Objective Specification"
      iri: https://spec.industrialontologies.org/ontology/construct/OutputObjectiveSpecification
      parent: "Objective Specification"
      definition: "An objective specification that prescribes the entities to be produced or modified in a planned process or the attributes they must possess to serve as valid outputs."
    - label: "Physical Location Identifier"
      iri: https://spec.industrialontologies.org/ontology/construct/PhysicalLocationIdentifier
      parent: "Identifier"
      definition: "An identifier that identifies a physical location (site)."
    - label: "Procuring Business Process"
      iri: https://spec.industrialontologies.org/ontology/construct/ProcuringBusinessProcess
      parent: "Business Process"
      definition: "A business process that consists of buying and ensuring the supply of products or services."
    - label: "Product Production Process"
      iri: https://spec.industrialontologies.org/ontology/construct/ProductProductionProcess
      parent: "Business Process"
      definition: "A business process that consists of at least one manufacturing process through which raw materials and components are transformed or modified to create a material product."
    - label: "Raw Material Role"
      iri: https://spec.industrialontologies.org/ontology/construct/RawMaterialRole
      parent: "Role"
      definition: "A role held by a material entity when it is acquired by an organizational entity with some plan to transform or modify it into intermediate-level components or substances or into a product."
    - label: "Offering For Sale Business Process"
      iri: https://spec.industrialontologies.org/ontology/construct/SellingBusinessProcess
      parent: "Business Process"
      definition: "A business process wherein a product or commercial service is offered by an agent (seller) for another agent (buyer) to acquire ownership via a financial instrument."
    - label: "Service Provider"
      iri: https://spec.industrialontologies.org/ontology/construct/ServiceProvider
      parent: "Supplier"
      definition: "A person or organization which has a service provider role."
    - label: "Service Provider Role"
      iri: https://spec.industrialontologies.org/ontology/construct/ServiceProviderRole
      parent: "Supplier Role"
      definition: "A supplier role held by a person or organization when it offers to sell or provide a commercial service."
    - label: "Supplier"
      iri: https://spec.industrialontologies.org/ontology/construct/Supplier
      parent: "Agent"
      definition: "A person or organization which has a supplier role."
    - label: "Supplier Role"
      iri: https://spec.industrialontologies.org/ontology/construct/SupplierRole
      parent: "Agent Role"
      definition: "An agent role held by a person or organization when it offers to sell or provide products or services."
    - label: "Supplying Business Process"
      iri: https://spec.industrialontologies.org/ontology/construct/SupplyingBusinessProcess
      parent: "Business Process"
      definition: "A business process wherein a product or service is supplied."
    - label: "Temporal Duration Value Expression"
      iri: https://spec.industrialontologies.org/ontology/construct/TemporalDurationValueExpression
      parent: "Value Expression"
      definition: "A value expression that describes the duration of some temporal interval."
    - label: "Temporal Instant Value Expression"
      iri: https://spec.industrialontologies.org/ontology/construct/TemporalInstantValueExpression
      parent: "Value Expression"
      definition: "A value expression that describes the position of a time instant in the time line."

type_sets:
  entity_participants: &entity_participants [Agent, Person, Organization, Group Of Agents, Organized Group Of Agents, Material Artifact, Material Product, Raw Material, Material Component, Container, System, Engineered System, Piece Of Equipment]
  process_types: &process_types [Planned Process, Manufacturing Process, Business Process, Measurement Process]
  roles: &roles [Role, Agent Role]
  process_participants: &process_participants [Agent, Person, Organization, Group Of Agents, Organized Group Of Agents, Material Artifact, Material Product, Raw Material, Material Component, Container, System, Engineered System, Piece Of Equipment, Planned Process, Manufacturing Process, Business Process, Measurement Process, Capability]

relationships:
  - label: "has capability"
    type: HAS_CAPABILITY
    iri: https://spec.industrialontologies.org/ontology/construct/hasCapability
    domain: *entity_participants
    range: ["Capability"]
    definition: "The thing has this capability."
  - label: "has component part at all times"
    type: HAS_COMPONENT_PART_AT_ALL_TIMES
    iri: https://spec.industrialontologies.org/ontology/construct/hasComponentPartAtAllTimes
    domain: *entity_participants
    range: *entity_participants
    definition: "The thing always has this component as a part."
  - label: "has component part at some time"
    type: HAS_COMPONENT_PART_AT_SOME_TIME
    iri: https://spec.industrialontologies.org/ontology/construct/hasComponentPartAtSomeTime
    domain: *entity_participants
    range: *entity_participants
    definition: "The thing has this component as a part at some time."
  - label: "has input"
    type: HAS_INPUT
    iri: https://spec.industrialontologies.org/ontology/construct/hasInput
    domain: *process_types
    range: *entity_participants
    definition: "The process takes this material as input."
  - label: "has output"
    type: HAS_OUTPUT
    iri: https://spec.industrialontologies.org/ontology/construct/hasOutput
    domain: *process_types
    range: *entity_participants
    definition: "The process produces this material as output."
  - label: "has role"
    type: HAS_ROLE
    iri: https://spec.industrialontologies.org/ontology/construct/hasRole
    domain: *entity_participants
    range: *roles
    definition: "The thing holds this role."
  - label: "has process characteristic"
    type: HAS_PROCESS_CHARACTERISTIC
    iri: https://spec.industrialontologies.org/ontology/construct/hasProcessCharacteristic
    domain: *process_types
    range: ["Process Characteristic"]
    definition: "The process has this summary characteristic."
  - label: "has process profile"
    type: HAS_PROCESS_PROFILE
    iri: https://spec.industrialontologies.org/ontology/construct/hasProcessProfile
    domain: *process_types
    range: ["Process Profile"]
    definition: "The process has this process profile."
  - label: "is input of"
    type: IS_INPUT_OF
    iri: https://spec.industrialontologies.org/ontology/construct/isInputOf
    domain: *entity_participants
    range: *process_types
    definition: "The material is an input of this process."
  - label: "is output of"
    type: IS_OUTPUT_OF
    iri: https://spec.industrialontologies.org/ontology/construct/isOutputOf
    domain: *entity_participants
    range: *process_types
    definition: "The material is an output of this process."
  - label: "participates in at some time"
    type: PARTICIPATES_IN_AT_SOME_TIME
    iri: http://purl.obolibrary.org/obo/BFO_0000056
    domain: *entity_participants
    range: *process_types
    definition: "The thing takes part in this process."
  - label: "measured by at some time"
    type: MEASURED_BY_AT_SOME_TIME
    iri: https://spec.industrialontologies.org/ontology/construct/measuredByAtSomeTime
    domain: *process_participants
    range: ["Measurement Process"]
    definition: "The thing is measured by this measurement process."
  - label: "is measured value of at some time"
    type: IS_MEASURED_VALUE_OF_AT_SOME_TIME
    iri: https://spec.industrialontologies.org/ontology/construct/isMeasuredValueOfAtSomeTime
    domain: ["Measured Value Expression"]
    range: *process_participants
    definition: "This measured value expression gives the measured value of the entity."