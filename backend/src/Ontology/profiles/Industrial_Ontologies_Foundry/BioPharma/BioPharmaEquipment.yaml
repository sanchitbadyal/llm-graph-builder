imports:
  - iri: "https://spec.industrialontologies.org/ontology/202603/biopharma/BiopharmaReferenceOntologyAttributes/"
    label: Biopharma Reference Ontology Attributes
  - iri: "https://spec.industrialontologies.org/ontology/202603/biopharma/ReferenceOntologyCandidates/"
    label: Reference Ontology Candidates
  - iri: "https://spec.industrialontologies.org/ontology/202603/core/Core/"
    label: IOF Core
    note: >
      Classes such as Capability, Engineered System, Material Artifact, Container, Role,
      Equipment Role, Material Entity, Site, Planned Process, Piece of Equipment and
      Production Consumable are defined in the imported modules, not in this module.


profile:
  id: biopharma-equipment-complete
  ontology_artifact: BiopharmaEquipment
  ontology_iri: "https://spec.industrialontologies.org/ontology/biopharma/BiopharmaEquipment/"
  version_iri: "https://spec.industrialontologies.org/ontology/202603/biopharma/BiopharmaEquipment/"
  title: Biopharma Equipment Ontology
  description: >-
    Complete profile generated from the Biopharma Equipment RDF; all named classes declared
    in the RDF artifact are represented here. The module covers equipment types, their
    properties (qualities, capabilities, functions), equipment specifications and validation.
    This RDF declares no new properties; the relationships listed below are those referenced
    in its class axioms. Examples are limited to the first few per class; adaptedFrom source
    links are omitted.
  include_ancestors: true
  include_compatible_properties: true


entities:
  # ---------------- Cell culture holding ----------------
  - label: Cell Culture Holding Capability
    iri: "https://spec.industrialontologies.org/ontology/construct/CellCultureHoldingCapability"
    parent_class: Material Containment Capability
    definition: >
      material containment capability to contain material undergoing a cell cultivation process
    examples:
      - "Capability of a T-flask to contain an adherent mammalian cell culture during incubation"
      - "Capability of a shake flask to contain a microbial or mammalian suspension culture during shaking cultivation"
      - "Capability of a bioreactor vessel to contain a cell culture during a controlled cultivation process"
    classification_conditions:
      - The entity must be a Material Containment Capability.
    logical_definition: >
      CellCultureHoldingCapability(x) → MaterialContainmentCapability(x)
    explanatory_note: >
      Specific to containing material while it undergoes cell cultivation (suspension or adherent cultures, microbial cultures, aggregates, tissues, culture-support materials, medium). Applies to vessels and vessel-like artifacts (T-flasks, shake flasks, spinner flasks, culture bags, microplate wells, bioreactor vessels). It does not by itself imply temperature, CO2 or humidity control, agitation, aeration, sterility or aseptic operation; those are separate capabilities.
    is_primitive: true
    primitive_rationale: >
      The formalization requires processes that are in the manufacturing execution and material module.


  - label: Cell Culture Holding Function
    iri: "https://spec.industrialontologies.org/ontology/construct/CellCultureHoldingFunction"
    parent_class: Cell Culture Holding Capability
    definition: >
      cell culture holding capability that is a function of a material entity
    examples:
      - "the cell culture holding function of a T-flask to contain material undergoing adherent-cell cultivation"
      - "the cell culture holding function of a bioreactor vessel to contain cultivated material during a controlled cultivation process"
    classification_conditions:
      - The entity must be a Cell Culture Holding Capability.
      - It must be the function of some Material Entity.
    logical_definition: >
      CellCultureHoldingFunction(x) ↔ CellCultureHoldingCapability(x) ∧ ∃m (MaterialEntity(m) ∧ functionOf(x, m))


  - label: Adherent Cell Culture Holding Capability
    iri: "https://spec.industrialontologies.org/ontology/construct/AdherentCellCultureHoldingCapability"
    parent_class: Cell Culture Holding Capability
    definition: >
      cell culture holding capability to contain an adherent cell culture during a cell cultivation process
    examples:
      - "Capability of a T-flask to contain adherent mammalian cells attached to its culture surface during incubation"
      - "Capability of a multilayer cell culture vessel to contain adherent cells and medium during scale-up"
      - "Capability of a microplate well to contain adherent cells during a cell-based assay"
    classification_conditions:
      - The entity must be a Cell Culture Holding Capability.
    logical_definition: >
      AdherentCellCultureHoldingCapability(x) → CellCultureHoldingCapability(x)
    is_primitive: true
    primitive_rationale: See the rationale under Cell Culture Holding Capability.


  - label: Adherent Cell Culture Holding Function
    iri: "https://spec.industrialontologies.org/ontology/construct/AdherentCellCultureHoldingFunction"
    parent_class: Adherent Cell Culture Holding Capability
    definition: >
      adherent cell culture holding capability that is a function of a material entity
    examples:
      - "the adherent cell culture holding function of a T-flask to contain cells attached to its culture surface"
      - "the adherent cell culture holding function of a fixed-bed bioreactor vessel to contain cells attached to its internal culture-support structure"
    classification_conditions:
      - The entity must be an Adherent Cell Culture Holding Capability.
      - It must be the function of some Material Entity.
    logical_definition: >
      AdherentCellCultureHoldingFunction(x) ↔ AdherentCellCultureHoldingCapability(x) ∧ ∃m (MaterialEntity(m) ∧ functionOf(x, m))


  - label: Suspension Cell Culture Holding Capability
    iri: "https://spec.industrialontologies.org/ontology/construct/SuspensionCellCultureHoldingCapability"
    parent_class: Cell Culture Holding Capability
    definition: >
      cell culture holding capability to contain a suspension cell culture during a cell cultivation process
    examples:
      - "Capability of a shake flask to contain a suspension culture during shaking cultivation"
      - "Capability of a spinner flask to contain a suspension cell culture during stirred cultivation"
      - "Capability of a bioreactor vessel to contain a suspension cell culture during a controlled cultivation process"
    classification_conditions:
      - The entity must be a Cell Culture Holding Capability.
    logical_definition: >
      SuspensionCellCultureHoldingCapability(x) → CellCultureHoldingCapability(x)
    is_primitive: true
    primitive_rationale: See the rationale under Cell Culture Holding Capability.


  - label: Suspension Cell Culture Holding Function
    iri: "https://spec.industrialontologies.org/ontology/construct/SuspensionCellCultureHoldingFunction"
    parent_class: Suspension Cell Culture Holding Capability
    definition: >
      suspension cell culture holding capability that is a function of a material entity
    examples:
      - "the suspension cell culture holding function of a shake flask to contain a suspension culture during shaking cultivation"
      - "the suspension cell culture holding function of a stirred-tank bioreactor vessel to contain a suspension cell culture during controlled cultivation"
    classification_conditions:
      - The entity must be a Suspension Cell Culture Holding Capability.
      - It must be the function of some Material Entity.
    logical_definition: >
      SuspensionCellCultureHoldingFunction(x) ↔ SuspensionCellCultureHoldingCapability(x) ∧ ∃m (MaterialEntity(m) ∧ functionOf(x, m))


  # ---------------- Containers ----------------
  - label: Vial
    iri: "https://spec.industrialontologies.org/ontology/construct/Vial"
    parent_class: Container
    definition: >
      container that is small, sealable, and designed for holding, storing, or dispensing small quantities of material
    examples:
      - "glass reagent vial used for chemical or media samples"
      - "autosampler vial used in analytical chromatography systems"
      - "cryovial used for frozen storage of a cryopreserved cell suspension"
    classification_conditions:
      - The entity must be a Container.
    logical_definition: >
      Vial(x) → Container(x)
    explanatory_note: >
      Often cylindrical, typically glass or plastic; commonly hold pharmaceutical preparations, injectables, biological products, cryopreserved cells or lab samples; some are used for headspace analysis; usually sealed with a stopper, screw cap or crimp closure.
    is_primitive: true
    primitive_rationale: >
      There are insufficient constructs present to create a set of necessary and sufficient conditions.


  - label: Cryovial
    iri: "https://spec.industrialontologies.org/ontology/construct/Cryovial"
    parent_class: Vial
    definition: >
      vial designed for storage of material at ultra-low temperatures
    examples:
      - "A 2 mL polypropylene cryovial with an O-ring screw cap designed for storing samples in vapor-phase liquid nitrogen."
    classification_conditions:
      - The entity must be a Vial.
    logical_definition: >
      Cryovial(x) → Vial(x)
    explanatory_note: >
      Specialized small sealable containers, typically plastic (e.g. polypropylene) or glass, designed to withstand liquid nitrogen or −80 °C conditions; used to preserve cells, tissues, nucleic acids or proteins.
    is_primitive: true
    primitive_rationale: >
      Insufficient constructs to create necessary and sufficient conditions; the required capabilities and functions are missing.


  - label: Flask
    iri: "https://spec.industrialontologies.org/ontology/construct/Flask"
    parent_class: Container
    definition: >
      container that has a body wider than its neck and is designed to contain material during a material transformation, separation, measurement, or cultivation process
    examples:
      - "a 2 L baffled Erlenmeyer flask holding a CHO seed culture"
      - "a 250 mL spinner flask containing a suspension cell culture"
      - "a T75 tissue-culture flask containing adherent HEK293 cells"
    classification_conditions:
      - The entity must be a Container.
    logical_definition: >
      Flask(x) → Container(x)
    explanatory_note: >
      Often glass or plastic; commonly conical (Erlenmeyer) or spherical (round-bottom); many are designed to allow heating, cooling or shaking.
    is_primitive: true
    primitive_rationale: >
      There are insufficient constructs present to create a set of necessary and sufficient conditions.


  - label: Shake Flask
    iri: "https://spec.industrialontologies.org/ontology/construct/ShakeFlask"
    parent_class: Flask
    definition: >
      flask designed for cultivating biological material or conducting chemical reactions that require aeration and mixing under agitated conditions with a shape that minimizes spillage during shaking
    examples:
      - "A 2 L baffled PETG Erlenmeyer flask used in small-scale mammalian cell culture, with vented cap and controlled shaking"
    counter_examples:
      - "Test tubes placed on a shaker: they lack the flask geometry, venting options and mixing dynamics of shake flasks."
    classification_conditions:
      - The entity must be a Flask.
    logical_definition: >
      ShakeFlask(x) → Flask(x)
    explanatory_note: >
      Often based on Erlenmeyer geometry; may include baffles to improve mixing and oxygen transfer; usually closed with breathable stoppers, foam plugs or vented caps; commonly used for inoculum preparation, strain screening and preliminary process optimization before scale-up; typically glass or plastic, from milliliters to liters.
    is_primitive: true
    primitive_rationale: >
      There are insufficient constructs present to create a set of necessary and sufficient conditions.


  - label: Spinner Flask
    iri: "https://spec.industrialontologies.org/ontology/construct/SpinnerFlask"
    parent_class: Flask
    definition: >
      flask designed for cultivating cells in suspension that has as part a component with a mixing function to keep the culture uniformly agitated
    examples:
      - "A 250 mL glass spinner flask with a magnetic stirring bar"
    counter_examples:
      - "T-flask for adherent cell culture, which lacks any internal component with a mixing function"
    disjoint_with:
      - T-flask
    classification_conditions:
      - The entity must be a Flask.
      - It must have some Material Component as a component part at all times, and that component must have some Mixing Function.
      - It must have some Suspension Cell Culture Holding Function.
    logical_definition: >
      SpinnerFlask(x) ↔ Flask(x) ∧ ∃c (MaterialComponent(c) ∧ hasComponentPartAtAllTimes(x, c) ∧ ∃a (MixingFunction(a) ∧ hasFunction(c, a))) ∧ ∃h (SuspensionCellCultureHoldingFunction(h) ∧ hasFunction(x, h))
    explanatory_note: >
      The mixing component is typically a magnetic stir bar, paddle or impeller built into the vessel and externally driven to keep cells and medium evenly agitated, preventing settling and improving oxygen and nutrient distribution. Commonly used for small-scale suspension cultures (e.g. hybridomas, CHO cells) before scale-up.


  - label: T-flask
    iri: "https://spec.industrialontologies.org/ontology/construct/TFlask"
    parent_class: Flask
    definition: >
      flask designed for cultivating adherent cells that has as part a flat growth surface for cell attachment and a narrow neck for adding or removing material while reducing contamination risk
    examples:
      - "A T75 polystyrene tissue culture flask with vented cap, used for adherent HEK293 cell expansion."
    counter_examples:
      - "A spinner flask for suspension cell culture, which lacks a flat surface for cell attachment and has an internal stirring element"
    disjoint_with:
      - Spinner Flask
    classification_conditions:
      - The entity must be a Flask.
      - It must have some Adherent Cell Culture Holding Function.
    logical_definition: >
      TFlask(x) → Flask(x) ∧ ∃f (hasFunction(x, f) ∧ AdherentCellCultureHoldingFunction(f))
    is_primitive: true
    primitive_rationale: >
      Insufficient constructs to create necessary and sufficient conditions; constructs for representing flask geometry (shape) are missing.


  - label: Bioreactor Vessel
    iri: "https://spec.industrialontologies.org/ontology/construct/BioreactorVessel"
    parent_class: Container
    definition: >
      container designed to contain material undergoing a cell cultivation process and to incorporate or interface with one or more components that provide mixing, aeration, monitoring, or control as part of a bioreactor
    examples:
      - "A 200 L single-use polymer bioreactor vessel"
      - "A 2 L borosilicate glass bioreactor vessel with a stainless steel headplate"
    classification_conditions:
      - The entity must be a Container.
      - It must have some Cell Culture Holding Function.
    logical_definition: >
      BioreactorVessel(x) → Container(x) ∧ ∃f (hasFunction(x, f) ∧ CellCultureHoldingFunction(f))
    explanatory_note: >
      The primary containment unit of a bioreactor; provides the physical space for cultivation or production while relying on integration with the bioreactor system for controlled conditions. Typical features include impellers, spargers, probes and ports. May be stainless steel, glass or single-use polymer.
    is_primitive: true
    primitive_rationale: >
      Insufficient constructs, particularly for representing that a container is designed to incorporate or interface with components of a bioreactor during cell cultivation.


  - label: Rocker Bag
    iri: "https://spec.industrialontologies.org/ontology/construct/RockerBag"
    parent_class: Container
    definition: >
      container that is a flexible bag designed for rocking or wave-motion mixing, gently agitating its contents to provide mixing and gas transfer that enable controlled cultivation of cells or microorganisms under low-shear conditions
    examples:
      - "Flexsafe RM bag"
    classification_conditions:
      - The entity must be a Container.
      - It must have some Cell Culture Holding Function.
      - If it is a member part at all times of some Bioreactor, it is a Bioreactor Vessel (additional subclass axiom stated in the RDF).
    logical_definition: >
      LA1: RockerBag(x) → Container(x) ∧ ∃f (hasFunction(x, f) ∧ CellCultureHoldingFunction(f)); LA2: RockerBag(x) ∧ ∃b (Bioreactor(b) ∧ memberPartOfAtAllTimes(x, b)) → BioreactorVessel(x)
    explanatory_note: >
      Single-use or disposable flexible culture chambers, typically inert plastic film; may be used with rocker-motion bioreactors or simpler incubator rockers or trays; mixing and gas transfer come from wave or rocking motion rather than impellers, reducing shear stress.
    is_primitive: true
    primitive_rationale: >
      Insufficient constructs, particularly for representing the flexible bag construction and the rocking or wave-motion configuration.


  # ---------------- Bioreactors ----------------
  - label: Bioreactor
    iri: "https://spec.industrialontologies.org/ontology/construct/Bioreactor"
    parent_class: Engineered System
    definition: >
      engineered system designed to provide a controlled environment for the cultivation of cells, tissues, or microorganisms, or for the production of material products or process intermediate materials by those biological entities
    examples:
      - "Stainless steel production bioreactor with integrated agitation and feed control"
      - "2000 L single-use production bioreactor for monoclonal antibody manufacturing"
      - "Stirred-tank seed bioreactor with automated pH and DO control"
    counter_examples:
      - "Empty stainless steel vessel without integrated agitation, control skid, or single-use bag system"
      - "Incubator designed to maintain temperature and CO2 for cell culture without agitation, feeding, or waste removal functions"
      - "static cell culture flask lacking active environmental controls"
    disjoint_with:
      - Chromatography System
      - Thawing System
    classification_conditions:
      - The entity must be an Engineered System.
      - It must have some Bioreactor Vessel as a member part at some time.
      - It must have some Cultivation Environment Function.
    logical_definition: >
      Bioreactor(x) ↔ EngineeredSystem(x) ∧ ∃b (BioreactorVessel(b) ∧ hasMemberPartAtSomeTime(x, b)) ∧ ∃f (CultivationEnvironmentFunction(f) ∧ hasFunction(x, f))


  - label: Production Bioreactor
    iri: "https://spec.industrialontologies.org/ontology/construct/ProductionBioreactor"
    parent_class: Bioreactor
    definition: >
      bioreactor which has a production bioreactor role
    examples:
      - "a 2,000 L stirred-tank bioreactor bearing a production bioreactor role during a monoclonal-antibody production culture"
      - "a microbial fermenter bearing a production bioreactor role during enzyme production"
    classification_conditions:
      - The entity must be a Bioreactor.
      - The entity must have some Production Bioreactor Role.
    logical_definition: >
      ProductionBioreactor(x) ↔ Bioreactor(x) ∧ ∃r (ProductionBioreactorRole(r) ∧ hasRole(x, r))
    explanatory_note: >
      See the expanded definition under the corresponding role class. Formalized as a defined class by referring to its role class, for modeling and implementation convenience.


  - label: Production Bioreactor Role
    iri: "https://spec.industrialontologies.org/ontology/construct/ProductionBioreactorRole"
    parent_class: Equipment Role
    definition: >
      equipment role held by a bioreactor when it is used or planned to be used to carry out a biomanufacturing production process
    examples:
      - "the production bioreactor role borne by a single-use bioreactor during a fed-batch CHO production culture"
      - "the production bioreactor role borne by a microbial fermenter during an enzyme-production culture"
    classification_conditions:
      - The role must be an Equipment Role.
      - It must be the role of some Bioreactor.
    logical_definition: >
      ProductionBioreactorRole(x) → EquipmentRole(x) ∧ ∃b (roleOf(x, b) ∧ Bioreactor(b))
    is_primitive: true
    primitive_rationale: >
      There are insufficient constructs in the ontology to create necessary and sufficient conditions.


  - label: Seed Bioreactor
    iri: "https://spec.industrialontologies.org/ontology/construct/SeedBioreactor"
    parent_class: Bioreactor
    definition: >
      bioreactor which has a seed bioreactor role
    examples:
      - "a 20 L stirred-tank bioreactor bearing a seed bioreactor role during cell expansion before inoculation of a 200 L production bioreactor"
      - "an N-1 perfusion bioreactor bearing a seed bioreactor role before inoculation of a production culture"
    classification_conditions:
      - The entity must be a Bioreactor.
      - The entity must have some Seed Bioreactor Role.
    logical_definition: >
      SeedBioreactor(x) ↔ Bioreactor(x) ∧ ∃r (SeedBioreactorRole(r) ∧ hasRole(x, r))
    explanatory_note: >
      See the expanded definition under the corresponding role class. Formalized as a defined class by referring to its role class, for modeling and implementation convenience.


  - label: Seed Bioreactor Role
    iri: "https://spec.industrialontologies.org/ontology/construct/SeedBioreactorRole"
    parent_class: Equipment Role
    definition: >
      equipment role held by a bioreactor that is involved or planned to be involved in carrying out a cell culture expansion process that is part of a seed train
    examples:
      - "the seed bioreactor role borne by an N-1 perfusion bioreactor before inoculation of a production bioreactor"
      - "the seed bioreactor role borne by a single-use bioreactor during an intermediate seed-train stage"
    classification_conditions:
      - The role must be an Equipment Role.
      - It must be the role of some Bioreactor.
    logical_definition: >
      SeedBioreactorRole(x) → EquipmentRole(x) ∧ ∃b (roleOf(x, b) ∧ Bioreactor(b))
    is_primitive: true
    primitive_rationale: >
      There are insufficient constructs in the ontology to create necessary and sufficient conditions.


  - label: Cultivation Environment Capability
    iri: "https://spec.industrialontologies.org/ontology/construct/CultivationEnvironmentCapability"
    parent_class: Capability
    definition: >
      capability of an engineered system to provide a controlled environment suitable for the growth or maintenance of cells, tissues, or microorganisms, or for the production of material products or process intermediates by those entities
    examples:
      - "the cultivation environment capability of a CO2 incubator to maintain temperature, carbon-dioxide concentration, and humidity for adherent mammalian-cell culture"
      - "the cultivation environment capability of a seed bioreactor to maintain temperature, pH, dissolved oxygen, mixing, and nutrient supply during cell expansion"
    classification_conditions:
      - The entity must be a Capability.
      - It must be the capability of some Engineered System.
      - It can only be realized in Planned Processes.
    logical_definition: >
      CultivationEnvironmentCapability(x) → Capability(x) ∧ ∃z (EngineeredSystem(z) ∧ capabilityOf(x, z)) ∧ ∀y (hasRealization(x, y) → PlannedProcess(y))
    is_primitive: true
    primitive_rationale: >
      There are insufficient constructs in the ontology to create necessary and sufficient conditions.


  - label: Cultivation Environment Function
    iri: "https://spec.industrialontologies.org/ontology/construct/CultivationEnvironmentFunction"
    parent_class: Cultivation Environment Capability
    definition: >
      cultivation environment capability that is a function of an engineered system
    examples:
      - "the cultivation environment function of a CO2 incubator to provide controlled temperature, carbon-dioxide concentration, and humidity for adherent mammalian-cell cultivation"
      - "the cultivation environment function of a seed bioreactor to provide suitable temperature, pH, dissolved oxygen, mixing, and nutrient supply during cell expansion"
    classification_conditions:
      - The entity must be a Cultivation Environment Capability.
      - It must be the function of some Engineered System.
    logical_definition: >
      CultivationEnvironmentFunction(x) ↔ CultivationEnvironmentCapability(x) ∧ ∃e (EngineeredSystem(e) ∧ functionOf(x, e))


  - label: Bioproduction Environment Capability
    iri: "https://spec.industrialontologies.org/ontology/construct/BioproductionEnvironmentCapability"
    parent_class: Cultivation Environment Capability
    definition: >
      cultivation environment capability to provide a controlled environment in which biological entities generate, or are expanded as, a material product or process intermediate
    examples:
      - "the bioproduction environment capability of a production bioreactor to maintain conditions for monoclonal-antibody production by a CHO cell culture"
      - "the bioproduction environment capability of a perfusion bioreactor to maintain conditions for high-density recombinant-protein production"
    classification_conditions:
      - The entity must be a Cultivation Environment Capability.
    logical_definition: >
      BioproductionEnvironmentCapability(x) → CultivationEnvironmentCapability(x)
    is_primitive: true
    primitive_rationale: >
      There are insufficient constructs in the ontology to create necessary and sufficient conditions.


  - label: Incubator
    iri: "https://spec.industrialontologies.org/ontology/construct/Incubator"
    parent_class: Engineered System
    definition: >
      engineered system designed to maintain controlled environmental conditions within an enclosed chamber for material entities placed within that chamber
    examples:
      - "CO2 incubator for mammalian cell culture."
      - "A stainless-steel laboratory incubator with HEPA filtration and automated humidity control, maintaining 37 °C and 5 percent CO2, used for cultivating CHO cells."
    counter_examples:
      - "a shaking water bath used to heat and mix samples in tubes (no enclosed, regulated chamber environment)"
      - "a bioreactor, because it controls conditions directly for material within its integrated vessel rather than around separately placed vessels"
    disjoint_with:
      - Chromatography System
    classification_conditions:
      - The entity must be an Engineered System.
    logical_definition: >
      Incubator(x) → EngineeredSystem(x)
    explanatory_note: >
      May regulate temperature, humidity, CO2, oxygen or light. Provides environmental control around material entities placed inside the chamber (flasks, plates, bags, tubes, vials); distinguish it from the vessel that directly holds the material. Differs from a bioreactor, which controls process conditions for the culture within its own vessel (agitation, aeration, pH, DO, temperature).
    is_primitive: true
    primitive_rationale: >
      There are insufficient constructs to create a set of necessary and sufficient conditions.


  # ---------------- Control capabilities ----------------
  - label: Control Capability
    iri: "https://spec.industrialontologies.org/ontology/construct/ControlCapability"
    parent_class: Capability
    definition: >
      capability of a material artifact, agent, or engineered system to carry out control during a planned process
    examples:
      - "the control capability of a bioreactor control system to carry out pH control during a production culture"
      - "the control capability of a mass-flow controller to carry out gas-flow control during aeration"
    classification_conditions:
      - The entity must be a Capability.
      - It must be the capability of some Material Artifact, Agent or Engineered System.
      - It can only be realized in Planned Processes.
    logical_definition: >
      ControlCapability(x) → Capability(x) ∧ ∃b ((MaterialArtifact(b) ∨ Agent(b) ∨ EngineeredSystem(b)) ∧ capabilityOf(x, b)) ∧ ∀p (hasRealization(x, p) → PlannedProcess(p))
    is_primitive: true
    primitive_rationale: >
      There are insufficient constructs in the ontology to create necessary and sufficient conditions.


  - label: Agitation Rate Controlling Capability
    iri: "https://spec.industrialontologies.org/ontology/construct/AgitationRateControllingCapability"
    parent_class: Control Capability
    definition: >
      control capability to carry out control of agitation rate
    examples:
      - "the agitation rate controlling capability of a stirred-tank bioreactor control system to maintain a specified impeller agitation rate"
      - "the agitation rate controlling capability of an incubator shaker to maintain a specified orbital shaking rate"
    classification_conditions:
      - The entity must be a Control Capability.
    logical_definition: >
      AgitationRateControllingCapability(x) → ControlCapability(x)
    is_primitive: true
    primitive_rationale: >
      There are insufficient constructs in the ontology to create necessary and sufficient conditions.


  - label: Dissolved Oxygen Controlling Capability
    iri: "https://spec.industrialontologies.org/ontology/construct/DissolvedOxygenControllingCapability"
    parent_class: Control Capability
    alternative_labels:
      - DO control capability
    definition: >
      control capability to carry out control of dissolved oxygen concentration within a particular liquid
    examples:
      - "the dissolved oxygen controlling capability of a stirred-tank bioreactor control system to control dissolved oxygen by adjusting agitation and gas flow"
      - "the dissolved oxygen controlling capability of a microbial fermenter control system to control dissolved oxygen by cascading air flow and oxygen enrichment"
    classification_conditions:
      - The entity must be a Control Capability.
    logical_definition: >
      DissolvedOxygenControllingCapability(x) → ControlCapability(x)
    is_primitive: true
    primitive_rationale: >
      There are insufficient constructs in the ontology to create necessary and sufficient conditions.


  - label: Flow Rate Controlling Capability
    iri: "https://spec.industrialontologies.org/ontology/construct/FlowRateControllingCapability"
    parent_class: Control Capability
    definition: >
      control capability to carry out control of flow rate
    examples:
      - "capability to control buffer flow rate during chromatography column equilibration"
      - "capability to adjust feed solution flow rate in a fed-batch fermentation process"
      - "capability to maintain consistent gas flow rate in a bioreactor sparging system"
    counter_examples:
      - "capability to measure flow rate passively without adjusting it"
      - "capability to maintain structural integrity of a pipe during fluid transfer"
    classification_conditions:
      - The entity must be a Control Capability.
    logical_definition: >
      FlowRateControllingCapability(x) → ControlCapability(x)
    is_primitive: true
    primitive_rationale: >
      There are insufficient constructs in the ontology to create necessary and sufficient conditions.


  - label: Flow Rate Controlling Function
    iri: "https://spec.industrialontologies.org/ontology/construct/FlowRateControllingFunction"
    parent_class: Flow Rate Controlling Capability
    definition: >
      flow rate controlling capability that is a function of a material artifact or engineered system
    examples:
      - "the flow rate controlling function of a chromatography system to control mobile-phase flow during column operation"
