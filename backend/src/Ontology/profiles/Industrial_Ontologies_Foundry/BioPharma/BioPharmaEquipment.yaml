    logical_definition: >
      MaterialTransferCapability(x) → Capability(x) ∧ ∃b ((Agent(b) ∨ MaterialArtifact(b) ∨ EngineeredSystem(b)) ∧ capabilityOf(x, b) ∧ ∀p (hasRealization(x, p) → ((MaterialAdditionProcess(p) ∨ MaterialRemovalProcess(p) ∨ MaterialTransferProcess(p)) ∧ ∃m ∃r (MaterialEntity(m) ∧ TransferredMaterialRole(r) ∧ hasParticipant(p, m) ∧ hasRole(m, r)) ∧ ∀n ((MaterialEntity(n) ∧ hasParticipant(p, n) ∧ ∃s (TransferredMaterialRole(s) ∧ hasRole(n, s))) → n ≠ b))))
    is_primitive: true
    primitive_rationale: >
      There are insufficient constructs in the ontology to create necessary and sufficient conditions.


