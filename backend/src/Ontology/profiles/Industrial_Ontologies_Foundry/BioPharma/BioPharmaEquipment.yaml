  # ---------------- Filtration ----------------
  - label: Filter
    iri: "https://spec.industrialontologies.org/ontology/construct/Filter"
    parent_class: Material Artifact
    definition: >
      material artifact that is porous and designed to retain particles above a certain size threshold when a fluid is passed through it
    examples:
      - "Polyvinylidene Fluoride (PVDF) membrane filter"
      - "Hollow-fiber Polyethersulfone (PES) membrane filter"
      - "Millistak+ HC Pro Pod Depth Filter"
    classification_conditions:
      - The entity must be a Material Artifact.
    logical_definition: >
      Filter(x) → MaterialArtifact(x)
    explanatory_note: >
      Retention is achieved by deposition of suspended particles on the filter surface or by capture within the porous medium. "Retain" here means physical exclusion or capture of particles above a defined size, through structural exclusion or entrapment, and is not reversible under normal operating conditions.
    is_primitive: true
    primitive_rationale: >
      There are insufficient constructs in the ontology to create necessary and sufficient conditions.


  - label: Depth Filter
    iri: "https://spec.industrialontologies.org/ontology/construct/DepthFilter"
    parent_class: Filter
    definition: >
      filter that does not rely on a uniform, defined pore size and that is designed to retain particles both on its surface and within its internal matrix
    examples:
      - "Cellulose-based depth filter"
      - "glass fiber depth filter"
      - "diatomaceous earth (DE) depth filter"
    disjoint_with:
      - Membrane Filter
    classification_conditions:
      - The entity must be a Filter.
    logical_definition: >
      DepthFilter(x) → Filter(x)
    explanatory_note: >
      Particles are entrapped or adsorbed both within and on the filter due to a randomly arranged matrix that creates a tortuous flow path, enabling retention of a broad range of particle sizes throughout the filter depth.
    is_primitive: true
    primitive_rationale: >
      There are insufficient constructs in the ontology to create necessary and sufficient conditions.


  - label: Membrane Filter
    iri: "https://spec.industrialontologies.org/ontology/construct/MembraneFilter"
    parent_class: Filter
    definition: >
      filter consisting of one or more flat or pleated porous layers made from polymers, that has a defined pore size enabling the removal of particles from liquids by (physical exclusion) sieving or surface adsorption
    examples:
      - "Regenerated cellulose membrane filter"
      - "PES (Polyethersulfone) membrane filter"
      - "Amicon Ultra Centrifugal Filter, 10 kDa MWCO"
    counter_examples:
      - "Metal filters"
      - "Activated carbon sheets"
      - "Glass fibers"
    disjoint_with:
      - Depth Filter
    classification_conditions:
      - The entity must be a Filter.
    logical_definition: >
      MembraneFilter(x) → Filter(x)
    explanatory_note: >
      Used in biopharmaceutical manufacturing for bioburden control, virus retention, concentration and buffer exchange, including sterilizing filtration (0.2 micron), mycoplasma protection (0.1 micron) and high-throughput buffer filtration; may be multi-layer or single-layer. Typical requirements for protein pharmaceuticals are low protein adsorption, high total throughput, minimum fouling and regulatory compliance.
    is_primitive: true
    primitive_rationale: >
      There are insufficient constructs in the ontology to create necessary and sufficient conditions.


