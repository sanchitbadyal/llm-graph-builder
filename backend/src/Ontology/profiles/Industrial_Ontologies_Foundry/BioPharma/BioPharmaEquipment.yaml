      - The entity must be a Material Entity.
    logical_definition: >
      ChromatographyMedium(x) → MaterialEntity(x)
    explanatory_note: >
      Typically engineered to separate by charge, size, hydrophobicity or specific affinity; may be functionalized with ligands or surface groups; commonly packed into columns or cartridges. Physical forms include resins (porous beads), monoliths (continuous porous structures) and membranes (thin porous films). In some workflows (e.g. affinity depletion) bound targets are not eluted, so binding appears irreversible, but the underlying interactions remain chemically reversible.
    is_primitive: true
    primitive_rationale: >
      There are insufficient constructs in the ontology to create necessary and sufficient conditions.


  - label: Affinity Chromatography Medium
    iri: "https://spec.industrialontologies.org/ontology/construct/AffinityChromatographyMedium"
    parent_class: Chromatography Medium
    definition: >
      chromatography medium which has an immobilized ligand as its part which has reversible binding capability to a specific part of a biomolecule
    examples:
      - "Protein A Resin typically used for IgG capture"
      - "IMAC resins for capturing proteins with a his-tag as their part"
      - "Streptavidin agarose used for capturing biotinylated proteins or nucleic acids"
    classification_conditions:
      - The entity must be a Chromatography Medium.
    logical_definition: >
      AffinityChromatographyMedium(x) → ChromatographyMedium(x)
    explanatory_note: >
      Functional groups are chemical moieties on the stationary phase giving general interaction types (ionic, hydrophobic). Ligands are a specialized subset: larger, more complex molecules covalently attached to enable highly selective binding through molecular recognition. Affinity chromatography uses ligands rather than general functional groups to emphasize this specificity.
    is_primitive: true
    primitive_rationale: >
      There are insufficient constructs in the ontology to create necessary and sufficient conditions.


  - label: Protein A Chromatography Medium
    iri: "https://spec.industrialontologies.org/ontology/construct/ProteinAChromatographyMedium"
    parent_class: Affinity Chromatography Medium
    definition: >
      affinity chromatography medium which has protein A as an immobilized ligand
    examples:
      - "Protein A immobilized on cross-linked agarose beads"
      - "Recombinant Protein A immobilized on methacrylate beads"
    classification_conditions:
      - The entity must be an Affinity Chromatography Medium.
      - It must have some Protein Binding Capability.
    logical_definition: >
      ProteinAChromatographyMedium(x) → AffinityChromatographyMedium(x) ∧ ∃c (ProteinBindingCapability(c) ∧ hasCapability(x, c))
    explanatory_note: >
      Protein A is a Staphylococcus aureus cell wall protein that binds the Fc region of IgG, making it a primary capture step in monoclonal antibody purification. IgG capture is deliberately not part of the definition (to keep the concept future-proof); a protein binding capability is added as an axiom instead.
    is_primitive: true
    primitive_rationale: >
      Insufficient constructs; specifically the Protein A ligand is missing.


  - label: Anion Exchange Chromatography Medium
    iri: "https://spec.industrialontologies.org/ontology/construct/AnionExchangeChromatographyMedium"
    parent_class: Chromatography Medium
    definition: >
      chromatography medium consisting of a matrix and positively charged molecules that are chemically bound to it
    examples:
      - "DEAE-Sepharose"
      - "Q Sepharose"
    classification_conditions:
      - The entity must be a Chromatography Medium.
    logical_definition: >
      AnionExchangeChromatographyMedium(x) → ChromatographyMedium(x)
    explanatory_note: >
      The positively charged molecules bound to the matrix serve as functional groups that provide the material basis of the resin function.
    is_primitive: true
    primitive_rationale: >
      There are insufficient constructs in the ontology to create necessary and sufficient conditions.


  - label: Cation Exchange Chromatography Medium
    iri: "https://spec.industrialontologies.org/ontology/construct/CationExchangeChromatographyMedium"
    parent_class: Chromatography Medium
    definition: >
      chromatography medium consisting of a matrix and negatively charged molecules that are chemically bound to it
    examples:
      - "CM-Sepharose"
      - "SP-Sepharose"
    classification_conditions:
      - The entity must be a Chromatography Medium.
    logical_definition: >
      CationExchangeChromatographyMedium(x) → ChromatographyMedium(x)
    explanatory_note: >
      The negatively charged molecules bound to the matrix serve as functional groups that provide the material basis of the resin function.
    is_primitive: true
    primitive_rationale: >
      There are insufficient constructs in the ontology to create necessary and sufficient conditions.


  - label: Hydrophobic Chromatography Medium
    iri: "https://spec.industrialontologies.org/ontology/construct/HydrophobicChromatographyMedium"
    parent_class: Chromatography Medium
    definition: >
      chromatography medium consisting of a matrix and hydrophobic molecules that are chemically bound to it
    examples:
      - "Butyl Sepharose used for Hydrophobic Interaction Chromatography"
      - "C18 Silica resin used for reversed-phase chromatography"
    classification_conditions:
      - The entity must be a Chromatography Medium.
    logical_definition: >
      HydrophobicChromatographyMedium(x) → ChromatographyMedium(x)
    explanatory_note: >
      The hydrophobic molecules bound to the matrix serve as functional groups that provide the material basis of the medium function.
    is_primitive: true
    primitive_rationale: >
      There are insufficient constructs in the ontology to create necessary and sufficient conditions.


  - label: Mixed Mode Chromatography Medium
    iri: "https://spec.industrialontologies.org/ontology/construct/MixedModeChromatographyMedium"
    parent_class: Chromatography Medium
    alternative_labels:
      - multimodal chromatography medium
    definition: >
      chromatography medium with immobilized functional groups designed to selectively interact with molecules through multiple distinct interaction mechanisms
    examples:
      - "Hydroxyapatite (CHT/CFT/Bio-Gel HT/HTP) resins that interact through electrostatic and calcium coordination complexes"
      - "Resins with hydrophobic ion exchange ligands"
    classification_conditions:
      - The entity must be a Chromatography Medium.
    logical_definition: >
      MixedModeChromatographyMedium(x) → ChromatographyMedium(x)
    explanatory_note: >
      Interaction modes may work cooperatively or independently depending on operating conditions. Example: the MEP ligand is hydrophobic at neutral and basic pH (uncharged pyridine ring) and becomes positively charged at lower pH, enabling ionic interactions (hydrophobic charge induction chromatography, HCIC).
    is_primitive: true
    primitive_rationale: >
      There are insufficient constructs in the ontology to create necessary and sufficient conditions.


  - label: Size Exclusion Chromatography Medium
    iri: "https://spec.industrialontologies.org/ontology/construct/SizeExclusionChromatographyMedium"
    parent_class: Chromatography Medium
    definition: >
      chromatography medium designed to selectively and reversibly retain molecules based on differences in their size, shape, or molecular mass
    examples:
      - "Sephacryl resins"
      - "Biogel Agarose Gel resins"
      - "Biogel P Polyacrylamide Gel Resins"
    classification_conditions:
      - The entity must be a Chromatography Medium.
    logical_definition: >
      SizeExclusionChromatographyMedium(x) → ChromatographyMedium(x)
    is_primitive: true
    primitive_rationale: >
      There are insufficient constructs in the ontology to create necessary and sufficient conditions.


  - label: Stationary Phase
    iri: "https://spec.industrialontologies.org/ontology/construct/StationaryPhase"
    parent_class: Material Entity
    definition: >
      material entity with a stationary phase role
    examples:
      - "C18 bonded silica as stationary phase in reverse-phase chromatography"
      - "agarose bead gel as stationary phase in size-exclusion chromatography"
      - "protein A immobilized on resin as stationary phase in affinity chromatography"
    counter_examples:
      - "an unpacked chromatography column"
      - "chromatography medium when it is offered for sale by its manufacturer"
    classification_conditions:
      - The entity must be a Material Entity.
      - The entity must have some Stationary Phase Role.
    logical_definition: >
      StationaryPhase(x) ↔ MaterialEntity(x) ∧ ∃r (StationaryPhaseRole(r) ∧ hasRole(x, r))
    explanatory_note: >
      Terms like "chromatographic bed" or "sorbent" may refer to various physical forms; prefer "liquid stationary phase" or "solid stationary phase" when specifying physical state.


  - label: Stationary Phase Role
    iri: "https://spec.industrialontologies.org/ontology/construct/StationaryPhaseRole"
    parent_class: Role
    definition: >
      role held by a solid, gel, or liquid that is planned to be or used in a chromatography process as the immobilized material which selectively and reversibly retains solutes in the mobile phase
    examples:
      - "the stationary phase role borne by Protein A resin during affinity chromatography"
      - "the stationary phase role borne by C18-bonded silica during reversed-phase chromatography"
    disjoint_with:
      - Mobile Phase Role
    classification_conditions:
      - The role must be a Role.
      - It must be the role of some Material Entity.
    logical_definition: >
      StationaryPhaseRole(x) → Role(x) ∧ ∃y (MaterialEntity(y) ∧ roleOf(x, y))
    explanatory_note: >
      The stationary phase selectively and reversibly retains solutes through differential interactions with both the stationary and mobile phases (size exclusion, ion exchange, affinity binding).
    is_primitive: true
    primitive_rationale: >
      Insufficient constructs; modeling of solid, gel or liquid is required.


  - label: Mobile Phase
    iri: "https://spec.industrialontologies.org/ontology/construct/MobilePhase"
    parent_class: Material Entity
    definition: >
      material entity with a mobile phase role
    examples:
      - "Water as mobile phase in reverse-phase chromatography"
      - "phosphate buffer as mobile phase in ion-exchange chromatography"
      - "a water-acetonitrile mixture serving as the mobile phase during gradient elution"
    counter_examples:
      - "Liquid used for column cleaning or sanitization after chromatography is completed"
      - "Air or nitrogen gas used for drying the column after elution"
    classification_conditions:
      - The entity must be a Material Entity.
      - The entity must have some Mobile Phase Role.
    logical_definition: >
      MobilePhase(x) ↔ MaterialEntity(x) ∧ ∃r (MobilePhaseRole(r) ∧ hasRole(x, r))


  - label: Mobile Phase Role
    iri: "https://spec.industrialontologies.org/ontology/construct/MobilePhaseRole"
    parent_class: Role
    definition: >
      role held by a fluid when it is planned to be or is used in a chromatography process to percolate through or along the stationary phase
    examples:
      - "the mobile phase role borne by phosphate buffer during ion-exchange chromatography"
      - "the mobile phase role borne by helium during gas chromatography"
    disjoint_with:
      - Stationary Phase Role
    classification_conditions:
      - The role must be a Role.
      - It must be the role of some Material Entity.
    logical_definition: >
      MobilePhaseRole(x) → Role(x) ∧ ∃y (MaterialEntity(y) ∧ roleOf(x, y))
    explanatory_note: >
      In gas chromatography the mobile phase may be called "carrier gas"; in an elution process it may be called "eluent".
    is_primitive: true
    primitive_rationale: >
      Insufficient constructs; modeling of fluid is required.


  - label: Chromatography System
    iri: "https://spec.industrialontologies.org/ontology/construct/ChromatographySystem"
    parent_class: Engineered System
    definition: >
      engineered system designed to control the fluid flow of the mobile phase, provide monitoring or detection capabilities, and house or interface with the stationary phase for one or more chromatography processes
    examples:
      - "AKTA FPLC Chromatography systems such as AKTA pure and AKTAprime plus"
      - "Agilent Gas Chromatography System"
      - "Vanquish HPLC and UHPLC Systems"
    disjoint_with:
      - Incubator
      - Bioreactor
      - Thawing System
    classification_conditions:
      - The entity must be an Engineered System.
      - It must have some Stationary Phase as a member part at some time.
      - It must have some Measurement Capability.
      - It must have some Flow Rate Controlling Function.
    logical_definition: >
      ChromatographySystem(x) ↔ EngineeredSystem(x) ∧ ∃s (StationaryPhase(s) ∧ hasMemberPartAtSomeTime(x, s)) ∧ ∃c (MeasurementCapability(c) ∧ hasCapability(x, c)) ∧ ∃f (FlowRateControllingFunction(f) ∧ hasFunction(x, f))
    explanatory_note: >
      Typically includes hardware for sample introduction, flow control and detection, plus software for configuring, monitoring and automating purification. Monitoring may include pH, conductivity, pressure, temperature. Available as single-use or multi-use models. "House or interface with the stationary phase" covers both built-in columns/cartridges and connection to external detachable columns.


  - label: Analytical Chromatography System
    iri: "https://spec.industrialontologies.org/ontology/construct/AnalyticalChromatographySystem"
    parent_class: Chromatography System
    alternative_labels:
      - analytic chromatographic system
    definition: >
      chromatography system designed to be used in chromatography processes with the primary objective of identifying or quantifying chemical or biological substances
    examples:
      - "Gas chromatography-mass spectrometry (GC-MS) system"
      - "High-performance liquid chromatography (HPLC) system with UV detection"
      - "Ultra-Performance Liquid Chromatography (UPLC) system"
    classification_conditions:
      - The entity must be a Chromatography System.
    logical_definition: >
      AnalyticalChromatographySystem(x) → ChromatographySystem(x)
    is_primitive: true
    primitive_rationale: >
      There are insufficient constructs in the ontology to create necessary and sufficient conditions.


  - label: Preparative Chromatography System
    iri: "https://spec.industrialontologies.org/ontology/construct/PreparativeChromatographySystem"
    parent_class: Chromatography System
    alternative_labels:
      - preparative chromatographic system
      - process chromatography system
    definition: >
      chromatography system designed to be used in chromatography processes that produce fractions for further downstream processing, such as purification, formulation, or additional separations
    examples:
      - "Stainless steel preparative HPLC system with large-diameter column"
      - "single-use preparative chromatography skid for monoclonal antibody purification"
      - "preparative affinity chromatography system with protein A resin"
    classification_conditions:
      - The entity must be a Chromatography System.
    logical_definition: >
      PreparativeChromatographySystem(x) → ChromatographySystem(x)
    explanatory_note: >
      Commonly used for purification, but also fractionation or other separations where multiple fractions are collected and retained. Typically involves larger sample loads and scales than analytical systems, which focus on identification and quantification.
    is_primitive: true
    primitive_rationale: >
      There are insufficient constructs in the ontology to create necessary and sufficient conditions.


relationships:
  # Referenced in class axioms; defined in imported modules (IOF Core / BFO), not declared in this RDF.

  - label: Has Role
    iri: "https://spec.industrialontologies.org/ontology/construct/hasRole"
    definition: >
      relationship from an entity to a role that it holds
    domain:
      - Bioreactor
      - Mobile Phase
      - Stationary Phase
      - Material Entity
    range:
      - Production Bioreactor Role
      - Seed Bioreactor Role
      - Mobile Phase Role
      - Stationary Phase Role
      - Transferred Material Role
    inverse: Role Of
    extraction_constraints:
      - Production Bioreactor must have a Production Bioreactor Role.
      - Seed Bioreactor must have a Seed Bioreactor Role.
      - Mobile Phase must have a Mobile Phase Role.
      - Stationary Phase must have a Stationary Phase Role.
      - The relationship direction is Role Bearer → Role.


  - label: Role Of
    iri: "https://spec.industrialontologies.org/ontology/construct/roleOf"
    definition: >
      relationship from a role to the entity that holds it
    domain:
      - Production Bioreactor Role
      - Seed Bioreactor Role
      - Single Use Role
      - Mobile Phase Role
      - Stationary Phase Role
    range:
      - Bioreactor
      - Piece of Equipment
      - Production Consumable
      - Material Entity
    inverse: Has Role
    extraction_constraints:
      - Production Bioreactor Role and Seed Bioreactor Role must be the role of a Bioreactor.
      - Single Use Role must be the role of a Piece of Equipment or Production Consumable.
      - Mobile Phase Role and Stationary Phase Role must be the role of a Material Entity.
      - The relationship direction is Role → Role Bearer.


  - label: Has Function
    iri: "https://spec.industrialontologies.org/ontology/construct/hasFunction"
    definition: >
      relationship from an entity to a function that it bears
    domain:
      - Bioreactor
      - Bioreactor Vessel
      - Rocker Bag
      - T-flask
      - Spinner Flask
      - Shaker
      - Chromatography System
      - Thawing System
      - Material Component
    range:
      - Cultivation Environment Function
      - Cell Culture Holding Function
      - Adherent Cell Culture Holding Function
      - Suspension Cell Culture Holding Function
      - Mixing Function
      - Flow Rate Controlling Function
      - Thawing Function
    inverse: Function Of
    extraction_constraints:
      - Bioreactor must have a Cultivation Environment Function.
      - Bioreactor Vessel and Rocker Bag must have a Cell Culture Holding Function.
      - T-flask must have an Adherent Cell Culture Holding Function.
      - Spinner Flask must have a Suspension Cell Culture Holding Function, and a component part with a Mixing Function.
      - Shaker must have a Mixing Function.
      - Chromatography System must have a Flow Rate Controlling Function.
      - Thawing System must have a Thawing Function.
      - The relationship direction is Function Bearer → Function.


  - label: Function Of
    iri: "https://spec.industrialontologies.org/ontology/construct/functionOf"
    definition: >
      relationship from a function to the entity in which it inheres
    domain:
      - Cell Culture Holding Function
      - Adherent Cell Culture Holding Function
      - Suspension Cell Culture Holding Function
      - Cultivation Environment Function
      - Flow Rate Controlling Function
      - Mixing Function
      - Thawing Function
    range:
      - Material Entity
      - Engineered System
      - Material Artifact
    inverse: Has Function
    extraction_constraints:
      - The three cell culture holding functions must be the function of a Material Entity.
      - Cultivation Environment Function must be the function of an Engineered System.
      - Flow Rate Controlling Function, Mixing Function and Thawing Function must be the function of a Material Artifact or Engineered System.
      - The relationship direction is Function → Function Bearer.


  - label: Has Capability
    iri: "https://spec.industrialontologies.org/ontology/construct/hasCapability"
    definition: >
      relationship from an entity to a capability that it bears
    domain:
      - Chromatography System
      - Protein A Chromatography Medium
    range:
      - Measurement Capability
      - Protein Binding Capability
    inverse: Capability Of
    extraction_constraints:
      - Chromatography System must have a Measurement Capability.
      - Protein A Chromatography Medium must have a Protein Binding Capability.
      - The relationship direction is Capability Bearer → Capability.


  - label: Capability Of
    iri: "https://spec.industrialontologies.org/ontology/construct/capabilityOf"
    definition: >
      relationship from a capability to the entity that bears it
    domain:
      - Control Capability
      - Cultivation Environment Capability
      - Material Transfer Capability
      - Mixing Capability
      - Heat Exchange Capability
      - Aseptic Barrier Capability
      - Thawing Capability
      - Protein Binding Capability
    range:
      - Agent
      - Engineered System
      - Material Artifact
      - Material Entity
    inverse: Has Capability
    extraction_constraints:
      - Control Capability and Material Transfer Capability must be the capability of an Agent, Material Artifact or Engineered System.
      - Cultivation Environment Capability must be the capability of an Engineered System.
      - Mixing, Heat Exchange, Aseptic Barrier and Thawing Capability must be the capability of an Engineered System or Material Artifact.
      - Protein Binding Capability must be the capability of a Material Entity.
      - The relationship direction is Capability → Capability Bearer.


  - label: Has Quality
    iri: "https://spec.industrialontologies.org/ontology/construct/hasQuality"
    definition: >
      relationship from an entity to a quality that it bears
    domain:
      - Material Entity
    range:
      - Fluid Aggregate State
      - Gaseous Aggregate State
      - Liquid Aggregate State
      - Solid Aggregate State
    extraction_constraints:
      - The transferred Material Entity in a fluid, gas, liquid or solid transfer must have the matching aggregate state quality.
      - The relationship direction is Quality Bearer → Quality.


  - label: Realized In
    iri: "http://purl.obolibrary.org/obo/BFO_0000054"
    definition: >
      relationship from a realizable entity (capability) to the process in which it is realized
    domain:
      - Control Capability
      - Cultivation Environment Capability
      - Material Transfer Capability
      - Fluid Transfer Capability
      - Thawing Capability
    range:
      - Planned Process
      - Material Addition Process
      - Material Removal Process
      - Material Transfer Process
    inverse: Realizes
    extraction_constraints:
      - Control, Cultivation Environment, Fluid Transfer and Thawing Capabilities can only be realized in Planned Processes.
      - Material Transfer Capability can only be realized in Material Addition, Material Removal or Material Transfer Processes.
      - The relationship direction is Capability → Process.


  - label: Has Participant
    iri: "http://purl.obolibrary.org/obo/BFO_0000057"
    definition: >
      relationship from a process to an entity that participates in it
    domain:
      - Planned Process
    range:
      - Material Entity
    inverse: Participates In
    extraction_constraints:
      - A process realizing a transfer capability must have as participant a Material Entity with a Transferred Material Role.
      - The relationship direction is Process → Participant.


  - label: Has Member Part
    iri: "http://purl.obolibrary.org/obo/BFO_0000115"
    definition: >
      relationship from a whole to a member part it has (the axioms use hasMemberPartAtSomeTime)
    domain:
      - Bioreactor
      - Chromatography System
    range:
      - Bioreactor Vessel
      - Stationary Phase
    extraction_constraints:
      - Bioreactor must have a Bioreactor Vessel as member part.
      - Chromatography System must have a Stationary Phase as member part.
      - The relationship direction is Whole → Member Part.


  - label: Has Component Part At All Times
    iri: "https://spec.industrialontologies.org/ontology/construct/hasComponentPartAtAllTimes"
    definition: >
      relationship from a whole to a component part it has at all times
    domain:
      - Spinner Flask
    range:
      - Material Component
    extraction_constraints:
      - Spinner Flask must have a Material Component with a Mixing Function as component part.
      - The relationship direction is Whole → Component Part.


  - label: Member Part Of At All Times
    iri: "http://purl.obolibrary.org/obo/BFO_0000173"
    definition: >
      relationship from a member part to the whole it is part of at all times (RDF uses BFO_0000173 in the anonymous Rocker Bag axiom; the FOL names it memberPartOfAtAllTimes)
    domain:
      - Rocker Bag
    range:
      - Bioreactor
    extraction_constraints:
      - A Rocker Bag that is a member part at all times of a Bioreactor is a Bioreactor Vessel.
      - The relationship direction is Member Part → Whole.