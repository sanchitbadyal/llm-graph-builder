entities:
  - label: CAS Registry Number
    iri: "https://spec.industrialontologies.org/ontology/construct/CASRegistryNumber"
    parent_class: Classifier
    definition: >
      classifier that is a sequence of digits defined within the Chemical
      Abstracts Service (CAS) registry, which classifies a type of chemical
      substance
    synonyms:
      - CAS number
    examples:
      - 64-19-7 classifies acetic acid
      - 50-00-0 classifies formaldehyde
    classification_conditions:
      - The entity must be a Classifier.
    logical_definition: >
      CASRegistryNumber(x) → Classifier(x)
    explanatory_note: >
      A CAS Registry Number is assigned by the Chemical Abstracts Service to
      uniquely identify a chemical substance, and each number corresponds
      to a single substance entry. It follows a format of three digit groups
      separated by hyphens (e.g., 7732-18-5 for water). Because it
      identifies a chemical type, relate it with 'denotes' and not with
      'designates', which is functional and implies a single individual.


  - label: Catalog Number
    iri: "https://spec.industrialontologies.org/ontology/construct/CatalogNumber"
    parent_class: Classifier
    definition: >
      classifier that is a sequence of alphanumeric characters created by an
      organization to classify a product they offer for sale
    synonyms:
      - product type identifier
    examples:
      - G8270 is the catalog number of glucose created by SigmaAldrich
      - 23225 is the catalog number for the Pierce BCA Protein Assay Kit created by ThermoFisher
      - 17543801 is the catalog number for MabSelect SuRe resins 25 mL created by Cytiva
      - 17543802 is the catalog number for MabSelect SuRe resins 25 mL created by Cytiva
    classification_conditions:
      - The entity must be a Classifier.
      - It must classify some Material Product.
    logical_definition: >
      CatalogNumber(x) → Classifier(x) ∧ ∃m
      (MaterialProduct(m) ∧ classifies(x, m))
    explanatory_note: >
      Not a catalog number is the number of a particular lot or batch.


  - label: Certificate Of Analysis
    iri: "https://spec.industrialontologies.org/ontology/construct/CertificateOfAnalysis"
    parent_class: Certificate
    definition: >
      certificate that provides quantitative results from analytical tests
      to verify that the attributes of a specific lot, batch, or individual
      product satisfy the requirement specifications stated in the
      certificate
    synonyms:
      - CoA
    examples:
      - Certificate of Analysis for Sodium Acetate Trihydrate (Catalog No. SA-12345, Lot 2025-05-17-01) issued by ChemStandard Inc. on 2025-07-20. The certificate reports measured values for properties such as purity (99.6%), pH (8.4), and water content (39.7%), and confirms the material meets ACS Reagent Grade specification.
    classification_conditions:
      - The entity must be a Certificate.
      - It must certify some Lot or Material Product.
      - It must have, at all times, some Requirement Specification as a continuant part.
      - That Requirement Specification must be satisfied by some Disposition or Quality that specifically depends on that Lot or Material Product.
      - It must have, at all times, some value as a continuant part that is the measured value of that Disposition or Quality at some time.
    logical_definition: >
      CertificateOfAnalysis(x) → Certificate(x) ∧ ∃q,y
      ((Disposition(q) ∨ Quality(q)) ∧ (MaterialProduct(y) ∨ Lot(y)) ∧
      specificallyDependsOn(q, y) ∧ ∃r (RequirementSpecification(r) ∧
      hasContinuantPartAtAllTimes(x, r) ∧ requirementSatisfiedBy(r, q)) ∧ ∃v
      (hasContinuantPartAtAllTimes(x, v) ∧ isMeasuredValueOfAtSomeTime(v,
      q)) ∧ certifies(x, y))
    explanatory_note: >
      A Certificate of Analysis includes numerical measurement results for
      one or more product attributes, in contrast to a Certificate of
      Conformance, which may only indicate pass/fail status. It typically
      also contains the name and address of the laboratory, product
      specifications, testing procedures, and the signature and date of the
      approving authority. It is issued for a specific lot or batch. Not a
      certificate of analysis are an internal lab notebook entry documenting
      experiment results, and a manufacturer certificate stating that a
      product meets a standard (e.g., ISO 9001) without any measurement
      results.


  - label: Certificate Of Conformance
    iri: "https://spec.industrialontologies.org/ontology/construct/CertificateOfConformance"
    parent_class: Certificate
    definition: >
      certificate issued by a manufacturer, supplier, or other authorized
      issuer that attests that a lot or batch or individual material product
      conforms to specified technical, safety, or regulatory requirements
      referenced in the certificate
    synonyms:
      - CoC
    examples:
      - A supplier-issued CoC stating that a raw material lot conforms to the purchase specification and applicable compendial requirements
      - A manufacturer-issued CoC stating that a single-use bioreactor bag lot conforms to specified material, sterility, and extractables requirements
      - A CoC for a chromatography resin batch stating that it conforms to the supplier’s technical specification for particle size, ligand density, and bioburden
      - A CoC for a tubing lot stating that the material conforms to USP Class VI and relevant ISO biocompatibility requirements
    classification_conditions:
      - The entity must be a Certificate.
      - It must certify some Lot or Material Product.
    logical_definition: >
      CertificateOfConformance(x) → Certificate(x) ∧ ∃y
      (certifies(x, y) ∧ (Lot(y) ∨ MaterialProduct(y)))


  - label: Enterprise Resource Planning Code
    iri: "https://spec.industrialontologies.org/ontology/construct/EnterpriseResourcePlanningCode"
    parent_class: Information System Specific Code
    definition: >
      information system specific code of an entity within an enterprise
      resource planning (ERP) system
    synonyms:
      - ERP code
    examples:
      - An ERP code assigned to a lot of cell culture media manufactured in a pharmaceutical company, used to track the batch through inventory, quality control, and release processes. Another ERP code may identify a specific media formulation type purchased from a supplier, while yet another code designates the supplier itself for integration into the procurement workflow.
    classification_conditions:
      - The entity must be an Information System Specific Code.
    logical_definition: >
      EnterpriseResourcePlanningCode(x) → InformationSystemSpecificCode(x)
    explanatory_note: >
      ERP codes are typically maintained as part of master data (data that
      does not change over time) rather than transactional data, and
      typically serve as the primary key for a master data record within an
      ERP system.


  - label: Expired State
    iri: "https://spec.industrialontologies.org/ontology/construct/ExpiredState"
    parent_class: Material State
    definition: >
      material state during which the participating material entity is no
      longer qualified to realize a particular specified capability and that
      temporally ends with the destruction or disposal of the material entity
    examples:
      - the state of a vaccine vial starting from its expiration date, during which it is no longer qualified to realize its specified capability for use as a vaccine, and which ends when the vial is discarded as biological waste
      - the state of a prepacked chromatography column beginning after it exceeds its validated number of separation cycles, during which it is no longer qualified to realize its specified separation capability, and which ends when the column is discarded
    classification_conditions:
      - The entity must be a Material State.
    logical_definition: >
      ExpiredState(x) → MaterialState(x)
    explanatory_note: >
      The expired state ends only with the end of the material entity's
      lifecycle; the entity does not return to a qualified state under
      normal circumstances. A specified capability is one the entity is
      intended, designed or qualified to realize. Expired state should not
      be confused with a best-before date, which concerns possible quality
      deterioration without necessarily making the material unsuitable or
      unsafe; model that separately. The first instant of the expired state
      is when the entity is no longer qualified to realize its specified
      capability, and may be set in advance from stability studies,
      predefined shelf life or validated use limits. Not an expired state is
      a chromatography column that temporarily fails performance
      specifications while undergoing regeneration for reuse.


  - label: Information System Specific Code
    iri: "https://spec.industrialontologies.org/ontology/construct/InformationSystemSpecificCode"
    parent_class: Denoter
    definition: >
      denoter that designates or classifies an entity or entity type within
      some information system that is internal to a particular organization
    examples:
      - ERP code is an identifier within an ERP system
    classification_conditions:
      - The entity must be a Denoter.
      - It must designate or classify some Entity.
    logical_definition: >
      InformationSystemSpecificCode(x) → Denoter(x) ∧ ∃y
      (Entity(y) ∧ (designates(x, y) ∨ classifies(x, y)))


relationships:

  - label: Has Material Expiration Time Instant Value Expression
    iri: "https://spec.industrialontologies.org/ontology/construct/hasMaterialExpirationTimeInstantValueExpression"
    definition: >
      relation from a material entity to a temporal instant value expression
      that is the value expression of the first instant of an expired
      material state of that material entity
    examples:
      - A vaccine vial will expire on "2025-12-31T00:00:00"
      - A thawed cell culture medium will expire at "2025-07-26 14:00"
      - A chromatography resin will expire on "April 1, 2027"
      - A prefilled syringe will expire in "week 48 of 2025"
    domain:
      - Material Entity
    range:
      - Temporal Instant Value Expression
    extraction_constraints:
      - Subject must be a Material Entity.
      - Object must be a Temporal Instant Value Expression.
      - The value is the first instant of the Expired State of that Material Entity.
      - The value format is not constrained (e.g., xsd:dateTime or an ISO 8601 string).
      - The relationship direction is Material Entity → Temporal Instant Value Expression.


  - label: Has Material First Use Time Instant Value Expression
    iri: "https://spec.industrialontologies.org/ontology/construct/hasMaterialFirstUseTimeInstantValueExpression"
    definition: >
      relation from a material entity to a temporal instant value expression
      that is the value expression of the first instant of a material use
      process in which the material entity participates
    examples:
      - chromatography resin was first used on "March 10, 2025"
      - reagent bottle was first opened on "2025-01-01"
      - stainless steel bioreactor was first used in production on "2022-11-15"
    domain:
      - Material Entity
    range:
      - Temporal Instant Value Expression
    extraction_constraints:
      - Subject must be a Material Entity.
      - Object must be a Temporal Instant Value Expression.
      - The value is the first instant of a material use process in which the Material Entity participates.
      - The value format is not constrained.
      - The relationship direction is Material Entity → Temporal Instant Value Expression.


  - label: Has Material Production Time Instant Value Expression
    iri: "https://spec.industrialontologies.org/ontology/construct/hasMaterialProductionTimeInstantValueExpression"
    definition: >
      relation from a material product or process intermediate material to a
      temporal instant value expression that is the value expression of the
      first instant of the temporal region during which the material product
      or process intermediate material exists
    examples:
      - batch of formulated drug product was produced on "2025-06-30"
      - vial of purified monoclonal antibody was produced on "2025-01-10"
      - lot of process intermediate was generated as the result of upstream processing on "2025-07-20 at 14:00"
    domain:
      - Material Product
      - Process Intermediate Material
    range:
      - Temporal Instant Value Expression
    extraction_constraints:
      - Subject must be a Material Product or Process Intermediate Material.
      - Object must be a Temporal Instant Value Expression.
      - The value is the first instant at which the Material Product or Process Intermediate Material exists.
      - The value format is not constrained.
      - The relationship direction is Material Product or Process Intermediate Material → Temporal Instant Value Expression.


  - label: Has Storage Start Time Instant Value Expression
    iri: "https://spec.industrialontologies.org/ontology/construct/hasStorageStartTimeInstantValueExpression"
    definition: >
      relation from a material entity to a temporal instant value expression
      that is the value expression of the first instant of a storage process
      in which the material entity participates
    examples:
      - A vial of vaccine was placed into refrigerated storage on "2025-01-15"
      - A batch of purified protein was transferred to a -80°C freezer on "2025-07-01 at 16:00"
      - A buffer solution was moved to temperature-controlled storage on "2025-05-30"
    domain:
      - Material Entity
    range:
      - Temporal Instant Value Expression
    extraction_constraints:
      - Subject must be a Material Entity.
      - Object must be a Temporal Instant Value Expression.
      - The value is the first instant of a storage process in which the Material Entity participates.
      - The value format is not constrained.
      - The relationship direction is Material Entity → Temporal Instant Value Expression.


  - label: Classifies
    iri: "https://spec.industrialontologies.org/ontology/construct/classifies"
    definition: >
      relationship from a classifier to the entity or entity type that it
      classifies
    domain:
      - CAS Registry Number
      - Catalog Number
      - Information System Specific Code
    range:
      - Material Product
      - Entity
    extraction_constraints:
      - Catalog Number must classify a Material Product.
      - CAS Registry Number classifies a chemical substance type.
      - Information System Specific Code must classify or designate an Entity.
      - The relationship direction is Classifier → Classified Entity.


  - label: Designates
    iri: "https://spec.industrialontologies.org/ontology/construct/designates"
    definition: >
      relationship from a denoter to the single individual entity that it
      designates
    domain:
      - Information System Specific Code
    range:
      - Entity
    extraction_constraints:
      - Information System Specific Code must designate or classify an Entity.
      - The relationship direction is Denoter → Designated Entity.


  - label: Certifies
    iri: "https://spec.industrialontologies.org/ontology/construct/certifies"
    definition: >
      relationship from a certificate to an entity that it certifies
    domain:
      - Certificate Of Analysis
      - Certificate Of Conformance
    range:
      - Lot
      - Material Product
    inverse: Has Certificate
    extraction_constraints:
      - Certificate Of Analysis must certify a Lot or Material Product.
      - Certificate Of Conformance must certify a Lot or Material Product.
      - The relationship direction is Certificate → Certified Entity.


  - label: Has Continuant Part At All Times
    iri: "http://purl.obolibrary.org/obo/BFO_0000110"
    definition: >
      relationship from a continuant to a continuant that is part of it at
      all times
    domain:
      - Certificate Of Analysis
    range:
      - Requirement Specification
      - Measured Value
    extraction_constraints:
      - Certificate Of Analysis must have a Requirement Specification as a continuant part.
      - Certificate Of Analysis must have a measured value as a continuant part.
      - The relationship direction is Whole → Part.


  - label: Is Measured Value Of At Some Time
    iri: "https://spec.industrialontologies.org/ontology/construct/isMeasuredValueOfAtSomeTime"
    definition: >
      relationship from a measured value to the disposition or quality whose
      value it is at some time
    domain:
      - Measured Value
    range:
      - Disposition
      - Quality
    extraction_constraints:
      - The measured value in a Certificate Of Analysis must be the measured value of a Disposition or Quality of the certified Lot or Material Product.
      - The relationship direction is Measured Value → Disposition or Quality.


  - label: Requirement Satisfied By
    iri: "https://spec.industrialontologies.org/ontology/construct/requirementSatisfiedBy"
    definition: >
      relationship from a requirement specification to an entity that
      satisfies it
    domain:
      - Requirement Specification
    range:
      - Disposition
      - Quality
    extraction_constraints:
      - The Requirement Specification in a Certificate Of Analysis must be satisfied by a Disposition or Quality of the certified Lot or Material Product.
      - The relationship direction is Requirement Specification → Disposition or Quality.


  - label: Specifically Depends On
    iri: "http://purl.obolibrary.org/obo/BFO_0000195"
    definition: >
      relationship from a dependent entity to the entity on which it
      specifically depends
    domain:
      - Disposition
      - Quality
    range:
      - Lot
      - Material Product
    extraction_constraints:
      - The Disposition or Quality tested in a Certificate Of Analysis must specifically depend on a Lot or Material Product.
      - The relationship direction is Disposition or Quality → Lot or Material Product.