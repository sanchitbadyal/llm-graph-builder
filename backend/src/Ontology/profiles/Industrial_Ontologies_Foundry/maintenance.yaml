profile:
  id: maintenance-complete
  ontology_artifact: maintenance
  description: >-
    Complete profile generated from Maintenance.rdf; all named classes and properties declared in the RDF artifact are represented here.
  include_ancestors: true
  include_compatible_properties: true

groups:
  ontology_classes:
    - label: "Degraded State"
      iri: https://spec.industrialontologies.org/ontology/construct/DegradedState
      parent: "Maintenance State"
      definition: "state of reduced ability to perform as required but with acceptable reduced performance"
    - label: "Disposition To Exhibit Undesirable Behavior"
      iri: https://spec.industrialontologies.org/ontology/construct/DispositionToExhibitUndesirableBehavior
      parent: "Undesirable Disposition"
      definition: "disposition of an item that would not be expected under normal operating conditions"
    - label: "Disposition To Fail"
      iri: https://spec.industrialontologies.org/ontology/construct/DispositionToFail
      parent: "Undesirable Disposition"
      definition: "disposition of an item to undergo a failure process"
    - label: "Failed State"
      iri: https://spec.industrialontologies.org/ontology/construct/FailedState
      parent: "Maintenance State"
      definition: "state of an item being unable to perform a required function due to a failure event"
    - label: "Failure Effect"
      iri: https://spec.industrialontologies.org/ontology/construct/FailureEffect
      parent: "Process"
      definition: "process that is the consequence of failure, within or beyond the boundary of the failed item"
    - label: "Failure Event"
      iri: https://spec.industrialontologies.org/ontology/construct/FailureEvent
      parent: "Event"
      definition: "event that causes an item to lose its ability to perform a required function"
    - label: "Failure Mode Code"
      iri: https://spec.industrialontologies.org/ontology/construct/FailureModeCode
      parent: "Information Content Entity"
      definition: "information content entity that describes an undesirable disposition"
    - label: "Failure Process"
      iri: https://spec.industrialontologies.org/ontology/construct/FailureProcess
      parent: "Process"
      definition: "process that changes some quality of an item causing the item to become degraded or failed"
    - label: "Functioning Process"
      iri: https://spec.industrialontologies.org/ontology/construct/FunctioningProcess
      parent: "Process"
      definition: "process in which an item performs its function"
    - label: "Maintenance Activity"
      iri: https://spec.industrialontologies.org/ontology/construct/MaintenanceActivity
      parent: "Maintenance Process"
      definition: "maintenance process that is a single task to retain or restore the function of a maintainable material item"
    - label: "Maintenance Process"
      iri: https://spec.industrialontologies.org/ontology/construct/MaintenanceProcess
      parent: "Planned Process"
      definition: "process to do with retaining or restoring the function of a maintainable material item under a maintenance strategy"
    - label: "Maintenance State"
      iri: https://spec.industrialontologies.org/ontology/construct/MaintenanceState
      parent: "Material State"
      definition: "stasis that holds during a temporal interval when the realizable functions and capabilities of the participating item, or the grade of realization of those functions and capabilities, remain unchanged"
    - label: "Maintenance Strategy"
      iri: https://spec.industrialontologies.org/ontology/construct/MaintenanceStrategy
      parent: "Plan Specification"
      definition: "maintenance (method/ approach/ actions) to enable (the/an) asset to achieve (management's/ desired) objectives"
    - label: "Maintenance Work Order Record"
      iri: https://spec.industrialontologies.org/ontology/construct/MaintenanceWorkOrderRecord
      parent: "Information Content Entity"
      definition: "information content entity that describes a maintenance process"
    - label: "Operating State"
      iri: https://spec.industrialontologies.org/ontology/construct/OperatingState
      parent: "Maintenance State"
      definition: "state of an item being able to perform a required function"
    - label: "Qualification Specification"
      iri: https://spec.industrialontologies.org/ontology/construct/QualificationSpecification
      parent: "Requirement Specification"
      definition: "requirement specification that identifies the need for a person to have an assessed skill for a specific task"
    - label: "Qualified Maintenance Person"
      iri: https://spec.industrialontologies.org/ontology/construct/QualifiedMaintenancePerson
      parent: "Person"
      definition: "person who is qualified to perform a specified maintenance activity"
    - label: "Required Function"
      iri: https://spec.industrialontologies.org/ontology/construct/RequiredFunction
      parent: "Function"
      definition: "function of a maintainable material item which is considered necessary to fulfil a process requirement"
    - label: "Supporting Maintenance Activity"
      iri: https://spec.industrialontologies.org/ontology/construct/SupportingMaintenanceActivity
      parent: "Planned Process"
      definition: "single action in support of the execution of a maintenance process"
    - label: "Undesirable Disposition"
      iri: https://spec.industrialontologies.org/ontology/construct/UndesireableDisposition
      parent: "Disposition"
      definition: "disposition of an item to undergo a process that leads to undesirable outcomes"

# Shared lists of entity types. PyYAML expands the *aliases when the file is loaded,
# so every relationship ends up with an explicit list of entity names.
type_sets:
  maintainable_items: &maintainable_items [Piece Of Equipment, Machine, Production Machine, Tool, Production Tool, Material Artifact, Engineered System, Equipment Module]
  maintenance_states: &maintenance_states [Maintenance State, Operating State, Degraded State, Failed State]
  maintenance_events: &maintenance_events [Failure Event, Failure Process, Failure Effect, Functioning Process, Maintenance Process, Maintenance Activity, Supporting Maintenance Activity]

relationships:
  - label: "has maintenance state"
    type: HAS_MAINTENANCE_STATE
    iri: https://spec.industrialontologies.org/ontology/construct/hasMaintenanceState
    domain: *maintainable_items
    range: *maintenance_states
    definition: "inverse of 'stateOf'"
  - label: "initiates"
    type: INITIATES
    iri: https://spec.industrialontologies.org/ontology/construct/initiates
    domain: *maintenance_events
    range: *maintenance_events
    definition: "comes before an event or process in time and results in beginning or creation of the event or process"
  - label: "maintenance state of"
    type: MAINTENANCE_STATE_OF
    iri: https://spec.industrialontologies.org/ontology/construct/maintenanceStateOf
    domain: *maintenance_states
    range: *maintainable_items
    definition: "relation that describes the maintenance state of a maintainable item"
