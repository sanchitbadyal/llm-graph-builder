profile:
  id: business-common
  ontology_artifact: business
  description: >-
    Shared organizations, organizational units, roles, positions, locations, and general business concepts.
  include_ancestors: true
  include_compatible_properties: true

groups:
  things_and_places:
    - label: "Warehouse"
      iri: http://example.org/ontology/business#Warehouse
      parent: "Facility"
      definition: "A facility used mainly to store goods."
    - label: "Location"
      iri: http://example.org/ontology/business#Location
      parent: null
      definition: "A bounded place in space that something can be located at."
    - label: "Address"
      iri: http://example.org/ontology/business#Address
      parent: null
      definition: "Information that identifies a place for delivery or contact."
    - label: "Position"
      iri: http://example.org/ontology/business#Position
      parent: null
      definition: "A post in an organization that can be held by a person."
  parties_and_roles:
    - label: "Organization"
      iri: http://example.org/ontology/business#Organization
      parent: null
      definition: "A group of people or other organizations that together form a unit acting under a common name, such as a company or an agency."
    - label: "Organizational Unit"
      iri: http://example.org/ontology/business#OrganizationalUnit
      parent: "Organization"
      definition: "A part of an organization, such as a department, team or plant management group."
    - label: "Cost Center"
      iri: http://example.org/ontology/business#CostCenter
      parent: "Organizational Unit"
      definition: "An organizational unit to which costs are collected."
    - label: "Legal Entity"
      iri: http://example.org/ontology/business#LegalEntity
      parent: "Organization"
      definition: "An organization that is recognised in law as able to own assets and sign contracts."
    - label: "Supplier Role"
      iri: http://example.org/ontology/business#SupplierRole
      parent: "Counterparty Role"
      definition: "A counterparty role held by a party that sells goods or services to the company."
    - label: "Employee Role"
      iri: http://example.org/ontology/business#EmployeeRole
      parent: "Business Role"
      definition: "A business role held by a person who works for the company."
    - label: "Approver Role"
      iri: http://example.org/ontology/business#ApproverRole
      parent: "Business Role"
      definition: "A business role that grants the holder authority to accept or reject a request."

# Property names the LLM may fill in on nodes and on edges. Global: every entity type and relationship can use them.
entity_properties:
  - identifier
  - amount
  - currency
  - order_date
  - delivery_date
  - status
  - priority
  - duration
  - quantity
  - unit_of_measure
  - location
  - notes

relationship_properties:
  - effective_date
  - delivery_date
  - status
  - duration
  - notes

# Shared lists of entity types. PyYAML expands the *aliases when the file is loaded,
# so every relationship ends up with an explicit list of entity names.
type_sets:
  documents: &documents [Sales Order, Sales Contract, Purchase Order, Quote, Credit Note, Receipt, Delivery Note, Specification, Certificate, Accounting Entry, Purchase Requisition, Shipping Document, Proof Of Shipment, Proof Of Delivery, Fiscal Period, Invoice, Revenue Entry, Accrual, Deferred Revenue, Non-Conformance Record]
  processes: &processes [Approval, Assessment, Audit, Billing, Payment, Collection, Fulfillment, Delivery, Transport, Stock Transfer, Service, Manufacturing, Procurement, Reconciliation, Revenue Recognition, Return, Escalation, Credit Check, Discount Approval, Invoice, Inter Plant Transfer, Shipment]
  workflow_processes: &workflow_processes [Approval, Assessment, Audit, Billing, Payment, Collection, Fulfillment, Delivery, Transport, Stock Transfer, Service, Manufacturing, Procurement, Reconciliation, Revenue Recognition, Return, Escalation, Credit Check, Discount Approval, Invoice, Inter Plant Transfer, Shipment, Planned Process, Manufacturing Process, Business Process, Measurement Process, Manufacturing Enterprise Process, Manufacturing Operation, Process Step, Changeover Process, Product Production Process, Product Inspection Process, Work-In-Progress Transfer Process]
  ownable: &ownable [Sales Order, Sales Contract, Purchase Order, Quote, Credit Note, Receipt, Delivery Note, Specification, Certificate, Accounting Entry, Purchase Requisition, Shipping Document, Proof Of Shipment, Proof Of Delivery, Fiscal Period, Account, Packaged Unit, Manufactured Product, Warehouse, Plant]
  documents_or_packaged: &documents_or_packaged [Sales Order, Sales Contract, Purchase Order, Quote, Credit Note, Receipt, Delivery Note, Specification, Certificate, Accounting Entry, Purchase Requisition, Shipping Document, Proof Of Shipment, Proof Of Delivery, Fiscal Period, Packaged Unit, Manufactured Product, Invoice, Revenue Entry, Accrual, Deferred Revenue, Non-Conformance Record]
  parties: &parties [Cost Center, Legal Entity, Organization, Organizational Unit, Profit Center]
  performers: &performers [Agent, Person, Group Of Agents, Organized Group Of Agents, Cost Center, Legal Entity, Organization, Organizational Unit, Profit Center]
  issuers: &issuers [Person, Agent, Cost Center, Legal Entity, Organization, Organizational Unit, Profit Center]
  parties_or_warehouse: &parties_or_warehouse [Cost Center, Legal Entity, Organization, Organizational Unit, Profit Center, Warehouse, Plant]
  all_roles: &all_roles [Approver Role, Employee Role, Supplier Role, Customer, Carrier]
  locations: &locations [Location, Warehouse, Plant]

relationships:
  - label: "has sub-unit"
    type: HAS_SUB_UNIT
    iri: http://example.org/ontology/business#hasSubUnit
    domain: [Organization]
    range: [Organizational Unit]
    definition: "An organization contains this unit."
  - label: "operates"
    type: OPERATES
    iri: http://example.org/ontology/business#operates
    domain: [Organization]
    range: [Plant]
    definition: "An organization operates this physical plant."
  - label: "performed at"
    type: PERFORMED_AT
    iri: http://example.org/ontology/business#performedAt
    domain: *workflow_processes
    range: *locations
    definition: "The process takes place at this location or warehouse."
  - label: "owned by"
    type: OWNED_BY
    iri: http://example.org/ontology/business#ownedBy
    domain: *ownable
    range: *parties
    definition: "The item belongs to this party."
  - label: "produces"
    type: PRODUCES
    iri: http://example.org/ontology/business#produces
    domain: *workflow_processes
    range: *documents_or_packaged
    definition: "The process creates this document or product."
  - label: "performed by"
    type: PERFORMED_BY
    iri: http://example.org/ontology/business#performedBy
    domain: *workflow_processes
    range: *performers
    definition: "The process is carried out by this party."
  - label: "role of"
    type: ROLE_OF
    iri: http://example.org/ontology/business#roleOf
    domain: *all_roles
    range: *parties
    definition: "The role is held by this party."
  - label: "has business input"
    type: HAS_BUSINESS_INPUT
    iri: http://example.org/ontology/business#hasInput
    domain: *workflow_processes
    range: *documents_or_packaged
    definition: "The process uses this business document, record, or product as input."
  - label: "has participant"
    type: HAS_PARTICIPANT
    iri: http://example.org/ontology/business#hasParticipant
    domain: *processes
    range: *parties
    definition: "This party takes part in the process."
  - label: "buys from"
    type: BUYS_FROM
    iri: http://example.org/ontology/business#buysFrom
    domain: *parties
    range: *parties
    definition: "The party purchases from this party."
  - label: "located at"
    type: LOCATED_AT
    iri: http://example.org/ontology/business#locatedAt
    domain: *parties_or_warehouse
    range: [Location]
    definition: "The party or warehouse is at this location."
  - label: "position in"
    type: POSITION_IN
    iri: http://example.org/ontology/business#positionIn
    domain: [Position]
    range: [Organization]
    definition: "A position belongs to this organization."
  - label: "has business role"
    type: HAS_BUSINESS_ROLE
    iri: http://example.org/ontology/business#hasRole
    domain: *parties
    range: *all_roles
    definition: "The party holds this role."
  - label: "follows"
    type: FOLLOWS
    iri: http://example.org/ontology/business#follows
    domain: *workflow_processes
    range: *workflow_processes
    definition: "The process happens after this earlier process."
  - label: "issued by"
    type: ISSUED_BY
    iri: http://example.org/ontology/business#issuedBy
    domain: *documents
    range: *issuers
    definition: "The document or record was issued by this person or organization."
  - label: "sells to"
    type: SELLS_TO
    iri: http://example.org/ontology/business#sellsTo
    domain: *parties
    range: *parties
    definition: "The party sells to this party."
  - label: "step of"
    type: STEP_OF
    iri: http://example.org/ontology/business#stepOf
    domain: *processes
    range: [Procedure]
    definition: "The process is a step of this procedure."
  - label: "triggers"
    type: TRIGGERS
    iri: http://example.org/ontology/business#triggers
    domain: *workflow_processes
    range: *workflow_processes
    definition: "The process causes this next process to start."
  - label: "has position"
    type: HAS_POSITION
    iri: http://example.org/ontology/business#hasPosition
    domain: [Organization]
    range: [Position]
    definition: "An organization has this position."
  - label: "sub-unit of"
    type: SUB_UNIT_OF
    iri: http://example.org/ontology/business#subUnitOf
    domain: [Organizational Unit]
    range: [Organization]
    definition: "A unit is part of this organization."
  - label: "has step"
    type: HAS_STEP
    iri: http://example.org/ontology/business#hasStep
    domain: [Procedure]
    range: *processes
    definition: "The procedure includes this step."
